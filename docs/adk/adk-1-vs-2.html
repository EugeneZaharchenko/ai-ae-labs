<section class="cover">
<h1>ADK 1.x → 2.x: tree to graph</h1>
<div class="subtitle">“ADK moved from a hierarchical agent executor to a graph engine” is a real architectural change, not marketing. What each one actually is — and what the swap costs you on upgrade.</div>

<div class="grid">
  <div class="card old-c">
    <h3>1.x — the model routes</h3>
    <p>The shape of your system lived in a <b>tree of agents</b>, and the route through it was chosen by the language model. ADK injected the names and descriptions of reachable agents into the prompt as text; the model replied with <code>transfer_to_agent()</code>. <b>Control flow was model output.</b></p>
  </div>
  <div class="card new-c">
    <h3>2.x — the graph routes</h3>
    <p>The shape lives in a <b>graph of typed nodes and edges</b>, and the route is chosen by matching an emitted route value against those edges. <b>Control flow is data.</b> Agents did not go away: <code>BaseAgent</code> now subclasses <code>BaseNode</code>, so an agent is one kind of node, and a whole graph is another.</p>
  </div>
</div>

<h2>Snapshot, and what was corrected</h2>
<p>Every version number on this deck is a dated snapshot, <b>станом на 08/2026</b>, verified against <code>proxy.golang.org</code> on 2026-08-30. The source document this was built from carried a stale pin, and it is corrected here rather than quietly patched, because it is the exact confusion this repo has hit before:</p>

<div class="tw">
<table>
<tr><th>Number</th><th>Value</th><th>What it means</th></tr>
<tr><td><code>google.golang.org/adk/v2</code></td><td><code>v2.2.0</code></td><td>Latest release, tagged 2026-08-10. The source document said <code>v2.0.0</code>.</td></tr>
<tr><td><code>adk/v2@v2.2.0</code> go directive</td><td><code>go 1.26.5</code></td><td><b>ADK's own floor.</b> The source document said “Go 1.25+”, which was true of v2.0.0 (<code>go 1.25.0</code>) and is two minors stale.</td></tr>
<tr><td><code>wiki-tools/go.mod</code></td><td><code>go 1.27</code></td><td><b>This repo's floor</b> — a different number from ADK's, and both are correct. A learner who “aligns” them breaks their build.</td></tr>
</table>
</div>

<div class="note">

<!-- 02 changed -->
<section>
<div class="crumb">MODULE 2 of 8</div>
<h1><span class="h-emoji">📊</span> changed</h1>
<div class="module">eight questions, asked of both engines</div>

<p>Each row asks one question of both engines. The claims are drawn from the ADK source, not from the announcement post — file references are named where the behaviour is non-obvious. Unless a row says otherwise, the file names are <b>adk-python</b>.</p>

<div class="dim">
  <div class="dimq"><span class="ix">01</span><h3>Who computes the next step?</h3><span class="verdict">prompt text → edge table</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>The language model</h4></div>
      <div class="pbody"><p>ADK appends the reachable agents' names and descriptions to the LLM request as instruction text — literally <i>“You have a list of other agents to transfer to…”</i> — then the model emits <code>transfer_to_agent(agent_name=…)</code>, which sets <code>tool_context.actions.transfer_to_agent</code>. Routing accuracy is a model behaviour.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>The graph</h4></div>
      <div class="pbody"><p>A node emits a route value on <code>Event.Routes</code>. <code>Graph.get_next_pending_nodes()</code> matches it against the declared edges: untagged edges always fire, a matching route wins, otherwise <code>DEFAULT_ROUTE</code>. No match and no default, and the branch quietly ends.</p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">02</span><h3>Where does the topology live?</h3><span class="verdict">inferred → declared</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>Implicit in the tree, at runtime</h4></div>
      <div class="pbody"><p><code>_get_transfer_targets()</code> computes the reachable set each request: sub-agents, plus the parent unless <code>disallow_transfer_to_parent</code>, plus every peer unless <code>disallow_transfer_to_peers</code>. You never wrote the graph down — you pruned a default one with negative flags.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>An explicit edge list</h4></div>
      <div class="pbody"><p><code>Edge{from_node, to_node, route}</code> is data you construct, and <code>validate_graph()</code> checks it before anything runs. The reachable set is exactly what you declared — reviewable in a diff.</p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">03</span><h3>How does data move between steps?</h3><span class="verdict">stringly-typed → typed</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>Shared session state, by string key</h4></div>
      <div class="pbody"><p><code>output_key</code> writes an agent's text response into <code>state['key']</code>; the next agent reads it by interpolating <code>{key}</code> into its instruction. Late-bound and silent on a typo — you find out from a bad answer, not an error.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>Typed output on the event</h4></div>
      <div class="pbody"><p>A node returns a value; the framework sets <code>Event.Output</code> and the successor receives it as typed input. <code>input_schema</code> / <code>output_schema</code> validate at the boundary, and Go's <code>NewAgentNodeTyped[In,Out]</code> gives it to you at compile time.</p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">04</span><h3>What is the unit of execution?</h3><span class="verdict">agent → node</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>An agent</h4></div>
      <div class="pbody"><p><code>BaseAgent._run_async_impl(ctx)</code> is the override point. A custom agent means subclassing and hand-writing the control flow yourself, including any retry, branching or bookkeeping.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>A node — and an agent is one</h4></div>
      <div class="pbody"><p><code>class BaseAgent(BaseNode, abc.ABC)</code>. Tools and plain functions are nodes too. So is a whole workflow: <code>class Workflow(BaseNode)</code>, whose docstring says <code>_run_impl()</code> <i>is</i> the graph orchestration loop. That single line is why graphs nest for free.</p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">05</span><h3>What happens when a step fails?</h3><span class="verdict">yours → the engine's</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>Your problem</h4></div>
      <div class="pbody"><p>Retry, backoff and timeout are application-level concerns. A failure inside <code>_run_async_impl</code> propagates however you wrote it.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>Per-node policy</h4></div>
      <div class="pbody"><p><code>RetryConfig</code> and <code>timeout_seconds</code> are fields on <code>BaseNode</code>; <code>NodeState.attempt_count</code> tracks the try. Graph-wide <code>WithMaxConcurrency(n)</code> caps parallel blast radius, and <code>NodeTimeoutError</code> is a distinct type.</p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">06</span><h3>Can a paused run survive a restart?</h3><span class="verdict">opt-in &amp; coarse → structural</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>Opt-in, agent-granular</h4></div>
      <div class="pbody"><p><code>ResumabilityConfig(is_resumable=True)</code> checkpointed agent completion through events. Sequential tracked <code>current_sub_agent</code>, Loop tracked <code>times_looped</code>, Parallel tracked which children finished. Tools could re-execute — a documented hazard for purchases.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>Built into node state</h4></div>
      <div class="pbody"><p>Status, <code>interrupts</code> and <code>resume_inputs</code> are serializable fields on <code>NodeState</code>, so <code>WAITING</code> outlives the process. In dynamic workflows, completed child activations are cached and skipped on resume. <code>rerun_on_resume</code> picks re-entry versus handoff.</p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">07</span><h3>Is a run reproducible?</h3><span class="verdict">no → by design</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>Not really</h4></div>
      <div class="pbody"><p>Event ids and timestamps were generated internally by <code>session.NewEvent(invocationID)</code>, and code could append straight onto <code>context.session.events</code>. Replaying a run to debug it was not a supported idea.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>Replay is a design goal</h4></div>
      <div class="pbody"><p><code>session.NewEvent(ctx, invocationID)</code> now takes a context, and ids and timestamps come from the <code>platform</code> package — so <code>platform.WithTimeProvider</code> and <code>WithUUIDProvider</code> let a workflow engine produce deterministic, replay-safe events. <b>(Go)</b></p></div></div>
  </div>
</div>

<div class="dim">
  <div class="dimq"><span class="ix">08</span><h3>Can you tell why it went there?</h3><span class="verdict">author only → node + route</span></div>
  <div class="split">
    <div class="panel old"><div class="phead"><div class="ptag">1.x · hierarchical</div><h4>You see who spoke</h4></div>
      <div class="pbody"><p>Events carry content and actions. You can see that a transfer happened and to whom, but the decision came from weighing description strings inside a prompt the framework assembled.</p></div></div>
    <div class="panel new"><div class="phead"><div class="ptag">2.x · graph</div><h4>You see the node and the route</h4></div>
      <div class="pbody"><p>Python's <code>Event</code> gains <code>node_info</code> and <code>output</code>; Go's gains <code>IsolationScope</code>, <code>Routes</code>, <code>RequestedInput</code>, <code>Output</code> and <code>NodeInfo</code>. The trace records both the path and the value that chose it.</p></div></div>
  </div>
</div>
</section>

<!-- 03 code -->
<section>
<div class="crumb">MODULE 3 of 8</div>
<h1><span class="h-emoji">📝</span> code</h1>
<div class="module">the same triage, written both ways · sub_agents vs AddRoutes</div>

<p>Notice where the topology is written down. On the left it is nowhere — it is inferred from nesting and constrained with negative flags. On the right it is a literal map. The left is Python because that is where the tree idiom is clearest; the right is Go because that is the SDK this course teaches.</p>

<div class="split">
  <div class="panel old">
    <div class="phead"><div class="ptag">ADK 1.x · hierarchical (Python)</div><h4>Topology is implied by nesting</h4></div>
    <pre><code><span class="c"># Nothing here states "triage may go to billing".</span>
<span class="c"># ADK derives that at runtime from the tree.</span>

billing = <span class="k">LlmAgent</span>(
    name=<span class="s">"billing"</span>,
    description=<span class="s">"Handles billing and refunds"</span>,   <span class="c"># ← the router reads THIS</span>
)
support = <span class="k">LlmAgent</span>(
    name=<span class="s">"support"</span>,
    description=<span class="s">"Handles technical problems"</span>,
)

triage = <span class="k">LlmAgent</span>(
    name=<span class="s">"triage"</span>,
    instruction=<span class="s">"Route the user to a specialist."</span>,
    sub_agents=[billing, support],
    <span class="c"># constrain reachability with NEGATIVE flags:</span>
    <span class="c"># disallow_transfer_to_parent=True</span>
    <span class="c"># disallow_transfer_to_peers=True</span>
)

<span class="c"># At request time ADK appends to the prompt:</span>
<span class="c">#   "You have a list of other agents to transfer to: ...</span>
<span class="c">#    NOTE: the only available agents are `billing`, `support`."</span>
<span class="c"># The model replies with transfer_to_agent(agent_name="billing"),</span>
<span class="c"># which sets tool_context.actions.transfer_to_agent.</span></code></pre>
  </div>

  <div class="panel new">
    <div class="phead"><div class="ptag">ADK 2.x · graph (Go)</div><h4>Topology is the edge table</h4></div>
    <pre><code><span class="c">// The reachable set IS this map. Nothing else.</span>

classify := workflow.<span class="n">NewEmittingFunctionNode</span>[Ticket, string](
    <span class="s">"classify"</span>,
    <span class="k">func</span>(ctx agent.Context, t Ticket,
        emit <span class="k">func</span>(*session.Event) <span class="k">error</span>) (<span class="k">string</span>, <span class="k">error</span>) {
        <span class="k">return</span> category(t), <span class="k">nil</span>   <span class="c">// pure code — no model call</span>
    },
    workflow.NodeConfig{},
)

<span class="c">// Edges are a VALUE you build, then hand to the agent.</span>
edges := workflow.<span class="n">Concat</span>(
    workflow.<span class="n">Chain</span>(workflow.Start, classifyNode, routeNode),
    []workflow.Edge{
        {From: routeNode, To: refundNode,   Route: workflow.<span class="n">StringRoute</span>(<span class="s">"BILLING"</span>)},
        {From: routeNode, To: supportNode,  Route: workflow.<span class="n">StringRoute</span>(<span class="s">"SUPPORT"</span>)},
        <span class="c">// Default is a route VALUE, not a call. There is no workflow.END —</span>
        <span class="c">// a branch simply has no outgoing edge.</span>
        {From: routeNode, To: fallbackNode, Route: workflow.Default},
    },
)

<span class="c">// A graph is an agent — same executor, so it nests:</span>
root, _ := workflowagent.<span class="n">New</span>(workflowagent.Config{
    Name: <span class="s">"triage"</span>, Edges: edges,
    SubAgents: []agent.Agent{classifier},
})

<span class="c">// Unmatched route with no Default? The branch simply ends —</span>
<span class="c">// validation/scheduling logs it and stops. Always</span>
<span class="c">// declare a Default.</span></code></pre>
  </div>
</div>

<div class="note">
The <code>Default</code> is not optional in practice. An unmatched route with no default does not raise — the branch <b>quietly ends</b>, which looks identical to a workflow that finished successfully. This is the single easiest way to ship a graph that silently drops requests.
</div>

<div class="module">session.Event · node_info · Routes · Output</div>

<p>The most practical difference on day one: in 2.x every event carries the node that produced it and the route it took, so a trace tells you <i>why</i> the path went where it went.</p>

<div class="split">
  <div class="panel old">
    <div class="phead"><div class="ptag">ADK 1.x</div><h4>Events carry content and actions</h4></div>
    <div class="pbody">
      <div class="trace">
        <div class="row"><span class="i">1</span><span class="ev">author=<em>triage</em> · function_call <q>transfer_to_agent</q></span></div>
        <div class="row"><span class="i">2</span><span class="ev">actions.<em>transfer_to_agent</em> = "billing"</span></div>
        <div class="row"><span class="i">3</span><span class="ev">author=<em>billing</em> · function_call <q>lookup_order</q></span></div>
        <div class="row"><span class="i">4</span><span class="ev">author=<em>billing</em> · function_response</span></div>
        <div class="row"><span class="i">5</span><span class="ev">author=<em>billing</em> · text · state_delta={…}</span></div>
      </div>
      <p style="margin-top:1rem">Why did it pick billing? Because of a description string, weighed against every other description, inside a prompt you did not write. The trace records the decision but not the reasoning behind it.</p>
    </div>
  </div>

  <div class="panel new">
    <div class="phead"><div class="ptag">ADK 2.x</div><h4>Events also carry node and route</h4></div>
    <div class="pbody">
      <div class="trace">
        <div class="row"><span class="i">1</span><span class="ev"><em>NodeInfo</em>=classify · <em>Output</em>=Ticket{…}</span></div>
        <div class="row"><span class="i">2</span><span class="ev"><em>Routes</em>=["BILLING"] · IsolationScope=root</span></div>
        <div class="row"><span class="i">3</span><span class="ev"><em>NodeInfo</em>=refund · status RUNNING</span></div>
        <div class="row"><span class="i">4</span><span class="ev"><em>NodeInfo</em>=refund · attempt_count=1</span></div>
        <div class="row"><span class="i">5</span><span class="ev"><em>NodeInfo</em>=refund · <em>Output</em>=Result{…} · COMPLETED</span></div>
      </div>
      <p style="margin-top:1rem">Go adds five fields to <code>Event</code> — <code>IsolationScope</code>, <code>Routes</code>, <code>RequestedInput</code>, <code>Output</code>, <code>NodeInfo</code>. Python adds <code>node_info</code> and <code>output</code>. That is why custom session services need a schema update.</p>
    </div>

</div>

<!-- 05 lifecycle -->
<section>
<div class="crumb">MODULE 5 of 8</div>
<h1><span class="h-emoji">♻️</span> lifecycle</h1>
<div class="module">NodeState · status · attempt_count · interrupts · resume_inputs</div>

<p>This is the quiet change that buys retries, timeouts, resumption and cancellation — all features 1.x expected you to build yourself. Every node carries a <code>NodeState</code> with a status, an attempt count, pending interrupt ids, and the resume payloads keyed by those ids.</p>

<div class="panel new">
  <div class="pbody">
    <div class="states">
      <span class="st">INACTIVE</span><span class="arrowc">→</span>
      <span class="st">PENDING</span><span class="arrowc">→</span>
      <span class="st">RUNNING</span><span class="arrowc">→</span>
      <span class="st">COMPLETED</span>
      <span class="arrowc" style="margin:0 .35rem">·</span>
      <span class="st">WAITING</span>
      <span class="st">FAILED</span>
      <span class="st">CANCELLED</span>
    </div>
    <p style="margin-top:1.1rem"><code>WAITING</code> is the human-in-the-loop state — the node is parked on a pending interrupt id, and its reply will arrive in <code>resume_inputs</code>. Because status lives in serializable state rather than in a call stack, a paused workflow survives a process restart. In 1.x, resumability was opt-in (<code>ResumabilityConfig(is_resumable=True)</code>) and coarse: a <code>SequentialAgent</code> remembered <code>current_sub_agent</code>, a <code>LoopAgent</code> remembered <code>times_looped</code>, and tools could re-execute.</p>
  </div>
</div>

<div class="note">
This is the same guarantee a durable-execution engine gives you, at a smaller scope. If you already know Temporal: a node here is an Activity, <code>NodeState</code> is the event history, and <code>WAITING</code> is a workflow parked on a signal. The difference is blast radius — ADK's version lives inside one process's session, not in a separate cluster.
</div>
</section>

<!-- 06 breaks -->
<section>
<div class="crumb">MODULE 6 of 8</div>
<h1><span class="h-emoji">💥</span> breaks</h1>
<div class="module">what actually breaks on upgrade</div>

<p>Most of these follow from one fact: the graph engine, not your class, is now in charge of scheduling and event emission. Anything that reached around it stops working.</p>

<div class="brk"><div class="lang">Python</div><div>
  <h5><code>BaseAgent</code> now extends <code>BaseNode</code></h5>
  <p>Custom overrides of <code>_run_async_impl()</code> or <code>generate_content()</code> are bypassed entirely by the graph engine. Inject custom logic through <code>BeforeAgentCallback</code> / <code>AfterAgentCallback</code> instead.</p></div></div>

<div class="brk"><div class="lang">Python</div><div>
  <h5><code>context.session.events.append()</code> breaks determinism</h5>
  <p>Events must be yielded from nodes so the engine can schedule and replay them. Direct appends bypass that bookkeeping.</p></div></div>

<div class="brk"><div class="lang">Python</div><div>
  <h5>Broad <code>except Exception</code> disables automatic retries</h5>
  <p>Swallowing a node failure hides it from the engine, which then has nothing to retry. Never catch <code>BaseException</code> — it traps <code>NodeInterruptedError</code> and hangs the pause.</p></div></div>

<div class="brk"><div class="lang">Python</div><div>
  <h5><code>Event</code> gains <code>node_info</code> and <code>output</code></h5>
  <p>Rigid database schemas need a migration. JSON-blob session storage typically needs no change.</p></div></div>

<div class="brk"><div class="lang">Go</div><div>
  <h5>Module path is now <code>google.golang.org/adk/v2</code></h5>
  <p>A mechanical import rewrite, but it touches every file. <b>On the Go floor, mind three different numbers</b> — the source this deck was built from collapsed them into a single stale “Go 1.25+”: <code>adk/v2@v2.0.0</code> declared <code>go 1.25.0</code>; <code>adk/v2@v2.2.0</code> (latest, станом на 08/2026) declares <code>go 1.26.5</code>; and this repo's own <code>wiki-tools/go.mod</code> declares <code>go 1.27</code>. Ours is not ADK's, and aligning them breaks a build.</p></div></div>

<div class="brk"><div class="lang">Go</div><div>
  <h5><code>session.NewEvent</code> requires a <code>context.Context</code></h5>
  <p>Signature is <code>NewEvent(ctx, invocationID)</code>. The parameterless form and the <code>NewEventWithContext</code> helper are both gone — thread the ctx already in scope rather than minting <code>context.Background()</code> mid-chain.</p></div></div>

<div class="brk"><div class="lang">Go</div><div>
  <h5><code>ToolContext</code> and <code>CallbackContext</code> merged into <code>agent.Context</code></h5>
  <p>Existing mocks stop compiling. Embed <code>agent.StrictContextMock</code> and override only what a test uses — un-overridden methods panic loudly instead of returning a silent zero value.</p></div></div>

<div class="brk"><div class="lang">Go</div><div>
  <h5><code>Event</code> gains five fields</h5>
  <p><code>IsolationScope</code>, <code>Routes</code>, <code>RequestedInput</code>, <code>Output</code>, <code>NodeInfo</code>. Custom session services need schema updates.</p></div></div>

<div class="brk"><div class="lang">Go</div><div>
  <h5>Custom <code>InvocationContext</code> implementations need two methods</h5>
  <p><code>IsolationScope()</code> and <code>ResumedInput()</code> are now part of the contract.</p></div></div>

<div class="note">
<b>The subtle one.</b> <code>NodeInterruptedError</code> subclasses <b>BaseException</b>, not <code>Exception</code> — deliberately, so that a stray <code>except Exception</code> cannot swallow a human-in-the-loop pause. But the inverse trap is real: a broad <code>except Exception</code> around node logic still masks ordinary failures from the engine and silently disables its automatic retries, and <code>except BaseException</code> will eat the interrupt itself and hang the workflow.
</div>
</section>

<!-- 07 stayed -->
<section>
<div class="crumb">MODULE 7 of 8</div>
<h1><span class="h-emoji">🧬</span> stayed</h1>
<div class="module">what did not change</div>

<p>The framing “hierarchical executor replaced by graph engine” overstates the demolition. The hierarchy is still there — it stopped being <i>the engine</i> and became a pattern that runs on one.</p>

<div class="tw">
<table>
<thead><tr><th>Still present in 2.x</th><th>What changed about it</th></tr></thead>
<tbody>
  <tr><td><code>sub_agents</code> delegation</td><td>Alive and documented as “collaborative workflows”. The coordinator auto-generates one delegation tool per sub-agent.</td></tr>
  <tr><td><code>transfer_to_agent</code></td><td>Still in <code>flows/llm_flows/agent_transfer.py</code>. Now suppressed for <code>task</code> and <code>single_turn</code> agents, which return automatically instead.</td></tr>
  <tr><td>Peer and parent transfer</td><td>Same <code>disallow_transfer_to_parent</code> / <code>disallow_transfer_to_peers</code> flags govern the reachable set.</td></tr>
  <tr><td><code>SequentialAgent</code>, <code>ParallelAgent</code>, <code>LoopAgent</code></td><td>Superseded by graph and dynamic workflows in Python/Go 2.0, but not removed. Fine for fixed-shape flows.</td></tr>
  <tr><td>The Runner event loop</td><td>Unchanged in shape: yield → Runner processes and commits → resume. State deltas still commit on the yielded event.</td></tr>
  <tr><td>Session state and prefixes</td><td><code>app:</code>, <code>user:</code>, <code>temp:</code> still work — but the docs now say not to move large payloads through state between nodes.</td></tr>
</tbody>
</table>
</div>

<div class="note">
<b>So which do you reach for?</b> Use the <b>graph</b> when the process is knowable — you get determinism, per-node retries, typed data flow, and a trace that explains itself. Use <b>collaborative delegation</b> when the request types are not enumerable and you genuinely need a model to choose the specialist. The healthy shape for most production systems is both: a deterministic graph spine with model-driven decisions confined to the nodes that actually need one.
</div>
</section>

<script>
(function () {
  const src = document.getElementById("src");
  const deck = document.getElementById("deck");
  const slides = [...src.content.querySelectorAll("section")].map((s) => {
    const el = s.cloneNode(true);
    el.classList.add("slide");
    deck.appendChild(el);
    return el;
  });
  const navs = [...document.querySelectorAll(".nav-item")];
  const bar = document.getElementById("progress");
  let i = 0;

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle("active", k === i));
    navs.forEach((a, k) => a.classList.toggle("on", k === i));
    bar.style.width = ((i + 1) / slides.length) * 100 + "%";
    // Stagger the direct children of the active slide. Assigned here rather
    // than authored into the markup so a new block never needs a hand-typed
    // delay; capped so a long module does not fade in for three seconds.
    const kids = [...slides[i].children];
    kids.forEach((c, k) => {
      c.classList.add("rise");
      c.style.setProperty("--d", Math.min(k * 0.05, 0.4) + "s");
    });
    if (location.hash !== "#" + (i + 1)) history.replaceState(null, "", "#" + (i + 1));
    deck.scrollIntoView({ block: "start" });
  }

  navs.forEach((a) =>
    a.addEventListener("click", (e) => {
      e.preventDefault();
      show(+a.dataset.go);
    })
  );

  addEventListener("keydown", (e) => {
    if (e.target.matches("input,textarea")) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(i - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "o" || e.key === "O") show(0);
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    }
  });

  addEventListener("hashchange", () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (!isNaN(n)) show(n - 1);
  });

  const start = parseInt(location.hash.slice(1), 10);
  show(isNaN(start) ? 0 : start - 1);
})();
</script>
