:root{
  /* ── Pi-Go design system ──────────────────────────────────────────────
     Source of truth: the "Pi-Go Design System" project on claude.ai/design,
     mirrored for the app at internal/serve/static/theme.css. These tokens are
     INLINED rather than linked because a shelf document must open from a USB
     stick with no network (verify.go rule 3), and because it is published as
     a Gist or handed round as a file — nothing external may be fetched at
     render time.

     Same constraint kills the webfonts: the three families are named below so
     a machine that has them installed uses them, but there is no @font-face
     (the woff2 live behind the server, and @import is a verify.go error), so
     most readers see the fallback stacks. That is the accepted trade for
     portability — the palette, not the type, is what makes the shelf read as
     one set.

     This shelf used to carry the Prometheus brandbook (cream/peach/orange,
     light mode). It moved to Pi-Go on 2026-08-30: the shelf is a wiki reading
     surface viewed inside `wiki serve`, not a learner-facing Prometheus deck,
     so it follows the wiki's own system. courses/STYLE.md still governs actual
     course decks under courses/ — do not "align" those to this file. */

  /* surfaces */
  --bg:#0a0a12; --bg-alt:#0d0d1a; --panel:#0f0f1e; --code-bg:#0a0a14;
  /* neon palette */
  --cyan:#00f0ff; --magenta:#ff00aa; --purple:#b347ff;
  --green:#00ff88; --yellow:#ffe600; --orange:#ff6a00;
  /* foreground — no pure white anywhere */
  --ink:#e0e0f0; --ink-dim:#8888aa; --ink-faint:#555577; --code-text:#cdd6f4;

  --line:rgba(0,240,255,.12); --line-strong:rgba(0,240,255,.25);
  --wash:rgba(0,240,255,.08);   /* the lit surface: tags, notes, chips */
  --accent:var(--cyan); --accent-2:var(--magenta);
  --glow:0 0 20px rgba(0,240,255,.3), 0 0 60px rgba(0,240,255,.1);

  /* Sharp, not rounded: 2px for chips and controls, 4px for panels. Pills and
     heavy rounding are off-brand in this system, which is why --pill is 2px
     and not 999px — the name is kept so the rules below did not have to move. */
  --radius:4px;
  --pill:2px;
  --nav-w:264px;
  --font-display:'Orbitron','SF Mono',ui-monospace,monospace;
  --font-body:'Rajdhani',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ── compatibility aliases ──────────────────────────────────────────────
   This document was hand-built on the Prometheus shell and its own components
   still name those tokens. Mapping them onto the Pi-Go palette here keeps
   those rules working without rewriting them: the orange accent becomes the
   cyan one, the peach fill becomes the cyan wash, and the white card ground
   becomes the dark panel. */
:root{
  --orange:var(--cyan); --peach:var(--wash);
  --white:var(--panel); --cream:var(--wash);
}


*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55}

/* ---- navigation ---------------------------------------------------------- */

#toc{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);z-index:50;
  background:var(--white);border-right:1.5px solid var(--line);
  overflow-y:auto;padding:1.1rem .8rem 2rem;
}
#toc .toc-h{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--ink);border-left:3px solid var(--orange);padding-left:9px;margin:.2rem 0 .8rem 4px;
}
.nav-item{
  display:flex;align-items:baseline;gap:.55rem;
  padding:.42rem .6rem;margin-bottom:2px;border-radius:var(--radius);
  text-decoration:none;color:var(--ink-dim);font-size:.9rem;
  border:1.5px solid transparent;transition:background .15s,border-color .15s,color .15s;
}
.nav-item:hover{background:var(--cream);color:var(--ink)}
.nav-item.on{background:var(--peach);border-color:var(--orange);color:var(--ink);font-weight:600}
.n-num{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);flex:none}
.nav-item.on .n-num{color:var(--ink)}
.n-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* emoji carry almost no right sidebearing, so the gap is set here, not typed
   as a space in the markup where it visually collapses against the glyph. */
.n-e,.c-e{margin-right:.4em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.c-e{font-weight:400}

/* ---- deck ---------------------------------------------------------------- */

#deck{margin-left:var(--nav-w);padding:3rem 1.5rem 5rem}
.slide{max-width:1000px;margin:0 auto;display:none}
.slide.active{display:block;animation:slide-in .32s ease both}
@keyframes slide-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* staged reveal: each block fades up in sequence once its slide is active.
   --d is assigned in JS so authored markup stays free of stagger bookkeeping. */
.slide.active > .rise{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1{font-size:2.2rem;color:var(--ink);margin-bottom:.3rem;font-family:var(--font-display);text-transform:uppercase;font-weight:900;letter-spacing:-.012em}
.cover h1{font-size:2.4rem}
.h-emoji{text-transform:none;font-weight:400;margin-right:.22em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.subtitle{color:var(--ink-dim);font-size:1.05rem;margin-bottom:1.5rem}
.module{color:var(--accent);font-family:var(--mono);font-size:.95rem;margin-bottom:1.2rem;word-break:break-word}
h2{font-size:1.3rem;color:var(--accent);margin:2rem 0 .7rem;font-family:var(--font-display);text-transform:uppercase;font-weight:900;letter-spacing:-.008em}
h3{font-size:1.05rem;color:var(--ink);font-weight:700;margin-bottom:.4rem}
p{color:var(--ink-dim);margin-bottom:.8rem;max-width:70ch}
.muted{color:var(--ink-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin:1rem 0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:1rem}
/* the sidebar narrows the content column, so long mono identifiers
   (workflow.NewEmittingFunctionNode) must be allowed to wrap rather than run
   past the card border. */
.card h3{font-size:1rem;color:var(--accent);margin-bottom:.4rem;font-family:var(--mono);overflow-wrap:anywhere}
.card p{font-size:.9rem;color:var(--ink-dim);margin:0}
a.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
a.card .path{display:block;font-size:.75rem;color:var(--ink-faint);margin-top:.4rem;font-family:var(--mono)}
.tag{display:inline-block;background:var(--peach);color:var(--ink);border:1.5px solid var(--orange);border-radius:var(--pill);padding:.1rem .6rem;font-size:.75rem;margin:.15rem .15rem 0 0;font-family:var(--mono)}
.badge{display:inline-block;background:var(--peach);color:var(--ink);border:1.5px solid var(--orange);border-radius:var(--pill);padding:.1rem .6rem;font-size:.75rem;margin-left:.4rem;vertical-align:middle;text-transform:none;font-weight:400}

/* ---- the one picture: a linear chain of steps ---------------------------- */
/* No SVG anywhere in this document. The catalog's own governing axis is a
   line, so a wrapping row of pills draws it without a single coordinate. */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin:1rem 0 1.2rem}
.chain span{background:var(--white);border:1.5px solid var(--line);border-radius:var(--radius);
            padding:.3rem .7rem;font-family:var(--mono);font-size:.82rem;color:var(--ink)}
.chain span.hot{border-color:var(--orange);background:var(--peach)}
.chain i{color:var(--orange);font-style:normal;font-weight:700}

ul{margin:0 0 .8rem 1.3rem}
li{margin-bottom:.35rem;color:var(--ink-dim)}
code{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.1rem .35rem;font-family:var(--mono);font-size:.85em;color:var(--accent)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;overflow-x:auto;margin:.8rem 0}
pre code{background:none;border:none;padding:0;color:var(--accent);display:block}
.note{border-left:3px solid var(--accent-2);background:var(--peach);padding:.8rem 1rem;border-radius:0 var(--radius) var(--radius) 0;margin:1rem 0;font-size:.92rem;color:var(--ink)}

/* ---- chrome -------------------------------------------------------------- */

#progress{position:fixed;left:0;top:0;height:3px;background:var(--orange);z-index:60;transition:width .3s ease}
#help{position:fixed;right:14px;top:12px;z-index:60;font-size:12px;color:var(--ink-faint)}

@media (prefers-reduced-motion:reduce){
  .slide.active,.slide.active > .rise{animation:none!important}
}

/* ---- mobile: sidebar becomes a scrollable strip -------------------------- */

@media (max-width:900px){
  :root{--nav-w:0px}
  #toc{position:static;width:auto;height:auto;border-right:0;border-bottom:1.5px solid var(--line);
       display:flex;gap:.35rem;overflow-x:auto;padding:.6rem .8rem;white-space:nowrap}
  #toc .toc-h{display:none}
  .nav-item{flex:none;margin:0}
  .n-t{max-width:42vw}
  #deck{margin-left:0;padding:1.6rem 1rem 4rem}
  #help{display:none}
  h1{font-size:1.7rem}
}

/* ---- print → PDF: every module, in order --------------------------------- */

@media print{
  @page{margin:14mm}
  #toc,#progress,#help{display:none!important}
  #deck{margin:0;padding:0}
  .slide{display:block!important;page-break-after:always;break-after:page;max-width:none}
  .slide *{animation:none!important;opacity:1!important;transform:none!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.risk{border-left:3px solid var(--orange);background:var(--white);padding:.8rem 1rem;
      border-radius:0 var(--radius) var(--radius) 0;margin:1rem 0;font-size:.92rem;color:var(--ink)}
.risk strong{color:var(--orange)}
/* tables: the shape this deck is mostly made of */
table{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:.92rem}
th{text-align:left;font-family:var(--font-display);text-transform:uppercase;font-size:.75rem;
   letter-spacing:.08em;color:var(--ink-faint);font-weight:700;padding:.35rem .6rem;

td{padding:.4rem .6rem;border-bottom:1px solid var(--line);color:var(--ink-dim);vertical-align:top}
td:first-child{white-space:nowrap;width:1%}
/* the wide comparison tables carry prose in the first column too, so the

.ok{color:var(--accent)}
.part{color:var(--ink)}
.no{color:var(--orange)}

/* ---- pattern topology diagrams (added 2026-09-03) -------------------------

.dg-head{fill:var(--ink-faint)}

.dg-link-warm{stroke:var(--magenta)}

.dg-b-model{fill:var(--bg-alt);stroke:var(--purple);stroke-width:1.6}

<section class="cover">
  <h1>Каталог патернів ADK 2.x — шпаргалка</h1>
  <div class="subtitle">16 патернів у формі Gang-of-Four · вісь «хто вирішує наступний крок» · і колонка, якої немає в джерелі: <strong>чи є це в Go v2.2.0</strong></div>

  <div class="note"><strong>Як це читати.</strong> Кожен патерн тут відсортовано за одним питанням, яке визначає його рахунок: наступний крок обирає <strong>код</strong> чи <strong>модель</strong>? Що правіше на цій осі — то більше викликів моделі витрачається на те, <em>щоб вирішити</em>, замість того, <em>щоб зробити</em>. Правило руху одне: <strong>починайте зліва й рухайтеся праворуч лише тоді, коли лівий патерн виміряно провалився</strong> — не тоді, коли він виглядає простувато.</div>

  <div class="chain">
    <span class="hot">один виклик + retrieval</span><i>›</i><span>B1 ланцюг</span><i>›</i><span>B2 віяло</span><i>›</i><span>B4 маршрут</span><i>›</i><span>B3 цикл</span><i>›</i><span>A2 ReAct</span><i>›</i><span>C1 координатор</span><i>›</i><span>C2 ієрархія</span><i>›</i><span class="hot">C3 рій</span>
  </div>

  <div class="risk"><strong>Чому ця сторінка взагалі існує.</strong> У джерелі списки примітивів для кожного патерну мовчки змішують <strong>три мови</strong>: <code>workflow.Chain()</code>, <code>AddFanOut()</code>, <code>JoinNode</code>, <code>RunNode[T]()</code> — це Go; <code>sub_agents=[…]</code>, <code>output_key</code>, <code>max_iterations</code>, <code>SequentialAgent</code>, <code>LoopAgent</code> — це Python; <code>RoutedAgent</code>/<code>AgentRouter</code> — це TypeScript. Go-читач не може зрозуміти з джерела, <em>що саме з цих шістнадцяти він може збудувати сьогодні</em>. Модуль <strong>02</strong> — це та відсутня колонка, і кожен її рядок звірено з реальним модулем, а не вгадано.</div>

  <h2>Дерево рішень</h2>
  <p>Перша гілка — та, яку пропускає більшість систем. Оптимізований одиночний виклик із retrieval виграє на несподівано великій частці задач, і це єдиний варіант тут, який не коштує нічого в експлуатації.</p>
  <ul>
    <li><strong>Чи впорається один оптимізований виклик LLM + retrieval?</strong><br>
      <em>так</em> → <strong>не будуйте агента. Зупиніться тут.</strong></li>
    <li><strong>Чи відома й фіксована послідовність кроків наперед?</strong>
      <ul>
        <li><em>так</em> → кроки незалежні? <em>так</em> → <strong>B2</strong> віяло · <em>ні</em> → <strong>B1</strong> ланцюг
          <ul>
            <li>+ розгалуження → <strong>B4</strong> маршрут</li>
            <li>+ «повторювати, доки» → <strong>B3</strong> цикл</li>
            <li>+ керування потоком у формі коду → <strong>B5</strong> власна логіка</li>
          </ul>
        </li>
        <li><em>ні</em> → категорії запитів перелічувані?
          <ul>
            <li><em>так</em> → <strong>C1</strong> координатор <em>(спершу спробуйте B4 — дешевше)</em></li>
            <li><em>ні</em> → потрібне багаторівневе планування? <em>так</em> → <strong>C2</strong> ієрархія · <em>ні</em> → <strong>A2</strong> ReAct</li>
          </ul>
        </li>
      </ul>
    </li>
    <li><strong>Чи мусять конфліктні точки зору сперечатися, щоб дати добру відповідь?</strong><br>
      <em>так</em> → <strong>C3</strong> рій — <strong>найдорожче й найменш відтворюване в каталозі. Обґрунтуйте.</strong></li>
    <li><strong>Модифікатори — накладаються на будь-що з переліченого:</strong> результат має пройти планку → <strong>D1</strong>; результат покращується з проходами → <strong>D2</strong>; рішення має схвалити людина → <strong>E1</strong>; незворотна конкретна дія → <strong>E2</strong>; failover / A-B / рівні моделей → <strong>C4</strong>.</li>
    <li><strong>Чи взагалі є людина, яка чекає на відповідь?</strong><br>
      <em>ні</em> → загорніть усе це в <strong>E3</strong> ambient.</li>
  </ul>

  <div class="note"><strong>Дві гілки, які варто прочитати двічі.</strong> Перша — «не будуйте агента»: вона єдина безкоштовна в експлуатації. Друга — «спершу спробуйте B4»: класифікатор плюс детермінований диспетч коштує один дешевий виклик, координатор — повний виклик моделі на кожен стрибок. Різниця між ними не в архітектурній красі, а в рахунку наприкінці місяця.</div>

    <tr><td><strong>A2</strong></td><td>ReAct</td><td class="part">🟡 збирається</td><td><code>workflow.NewDynamicNode[IN,OUT]</code> + <code>workflow.RunNode[OUT]</code>, або цикл у графі з маршрутом</td><td>Примітива з назвою ReAct немає в жодній мові — це форма графа, а не тип. Крок-кап пишете ви</td></tr>

    <tr><td><strong>B2</strong></td><td>Parallel Fan-Out / Gather</td><td class="ok">✅ є</td><td><code>EdgeBuilder.AddFanOut(from, to…)</code>, <code>.AddFanIn(to, from…)</code>, <code>workflow.NewJoinNode(name)</code>, <code>workflow.NewParallelWorker(name, wrapped, maxConcurrency, cfg)</code>, <code>NodeConfig.ParallelWorker</code>, <code>workflow.WithMaxConcurrency(n)</code></td><td>Джерело подає <code>MaxConcurrency</code> як поле. <strong>Поля з такою назвою в Go немає</strong>: є опція графа <code>WithMaxConcurrency</code> й аргумент <code>NewParallelWorker</code></td></tr>

    <tr><td><strong>B3</strong></td><td>Loop</td><td class="ok">✅ є</td><td>цикл у графі з маршрутом, <code>workflow.BoolRoute</code>, <code>loopagent.New</code> + <code>Config.MaxIterations uint</code>, <code>tool/exitlooptool</code></td><td><code>max_iterations</code> → <code>MaxIterations</code>. Беззумовний цикл узагалі не збереться — див. модуль 09</td></tr>

    <tr><td><strong>B4</strong></td><td>Conditional Route</td><td class="ok">✅ є</td><td><code>EdgeBuilder.AddRoute(from,to,route)</code>, <code>.AddRoutes(from, map[string]Node)</code>, <code>workflow.NewEmittingFunctionNode</code>, <code>StringRoute</code> / <code>IntRoute</code> / <code>BoolRoute</code> / <code>MultiRoute[T]</code>, <code>workflow.Default</code></td><td><code>Default</code> — це <code>var Default Route</code>, тобто значення маршруту, а не поле й не рядок</td></tr>

    <tr><td><strong>B5</strong></td><td>Custom Logic</td><td class="part">🟡 частково</td><td><code>workflow.NewDynamicNode[IN,OUT]</code>, тіло як <code>DynamicFn[IN,OUT]</code>, <code>workflow.RunNode[OUT]</code>, <code>WithRunID</code>, <code>WithUseSubBranch</code>, <code>NodeConfig.RetryConfig</code>, <code>NodeConfig.RerunOnResume *bool</code></td><td><strong>Типу з назвою <code>DynamicNode</code> в Go немає</strong> — конструктор повертає <code>workflow.Node</code>. Назва з джерела — концептуальна</td></tr>

    <tr><td><strong>C1</strong></td><td>Coordinator / Dispatcher</td><td class="ok">✅ є</td><td><code>llmagent.Config.SubAgents []agent.Agent</code>, <code>llmagent.Mode</code> зі значеннями <code>ModeChat</code>, <code>ModeTask</code>, <code>ModeSingleTurn</code></td><td><code>finish_task</code> існує, але <strong>як внутрішній інструмент рантайму</strong> (<code>internal/workflowinternal</code>) — ви його не викликаєте</td></tr>

    <tr><td><strong>C2</strong></td><td>Hierarchical Decomposition</td><td class="ok">✅ є</td><td><code>agenttool.New(agent, cfg)</code>, <code>workflow.NewWorkflowNode(name, edges)</code>, <code>workflowagent.New(Config{Edges…})</code></td><td>Вкладені графи — через <code>WorkflowNode</code>; імена підграфів мусять відрізнятися від імені батька</td></tr>

    <tr><td><strong>C3</strong></td><td>Swarm</td><td class="no">❌ примітива немає</td><td>—</td><td>Рядка <code>Swarm</code> у модулі немає взагалі — джерело каже те саме. Збирається вручну з <code>NewDynamicNode</code> + спільного стану</td></tr>

    <tr><td><strong>C4</strong></td><td>Routed Agent</td><td class="no">❌ у Go відсутнє</td><td>—</td><td><code>RoutedAgent</code> і <code>AgentRouter</code> <strong>у <code>adk/v2 v2.2.0</code> не існують узагалі</strong>. Джерело саме позначає їх як TypeScript v1.0.0, experimental — перенесено неперевіреним</td></tr>

    <tr><td><strong>D1</strong></td><td>Review and Critique</td><td class="part">🟡 композиція</td><td><code>sequentialagent.New</code>, <code>OutputKey</code>, <code>BoolRoute</code> для гілки «на доопрацювання»</td><td>Іменованого примітива «critic» немає в жодній мові: це два вузли й один маршрут між ними</td></tr>

    <tr><td><strong>D2</strong></td><td>Iterative Refinement</td><td class="ok">✅ є</td><td><code>loopagent.New</code> + <code>MaxIterations</code>, або цикл у Go-коді всередині <code>NewDynamicNode</code></td><td>Найкраще працює там, де є детермінований перевіряч — компілятор, тести, валідатор схеми</td></tr>

    <tr><td><strong>E1</strong></td><td>Human-in-the-Loop</td><td class="ok">✅ є</td><td><code>workflow.ResumeOrRequestInput(ctx, emit, req)</code>, <code>session.RequestInput{InterruptID, Message, ResponseSchema, Payload}</code>, <code>NodeConfig.RerunOnResume *bool</code>, <code>workflow.NewRequestInputEvent</code>, <code>Workflow.Resume</code></td><td>У Go є окремий обмежувач: <code>ErrParallelHITLUnsupported</code> — <strong>паралельний HITL не підтримується</strong>. Джерело цього не згадує</td></tr>

    <tr><td><strong>E2</strong></td><td>Tool Confirmation Gate</td><td class="part">🟡 частково</td><td><code>agent.Context.RequestConfirmation(hint string, payload any) error</code>, <code>ctx.ToolConfirmation()</code>, <code>tool.WithConfirmation(ts, requireConfirmation, provider)</code>, пакет <code>tool/toolconfirmation</code></td><td><strong><code>SecurityPlugin</code> і <code>PolicyOutcome.CONFIRM</code> у Go відсутні</strong>. Найближче — <code>plugin.Config.BeforeToolCallback</code></td></tr>

    <tr><td><strong>E3</strong></td><td>Ambient Agent</td><td class="no">❌ не примітив ADK</td><td><code>server/adkrest</code>, <code>server/agentengine</code>, <code>server/adka2a</code> — транспорт, не оркестрація</td><td>Pub/Sub, Eventarc, Cloud Scheduler зі списку джерела — це <strong>GCP, а не ADK</strong>. E3 — обгортка розгортання: тілом може бути будь-який патерн A–D</td></tr>
  </table>
  </div>

  <div class="note"><strong>Підсумок для Go-читача.</strong> З шістнадцяти патернів <strong>дев'ять</strong> мають прямі примітиви в Go v2.2.0, <strong>чотири</strong> збираються з наявного без іменованої підтримки (A2, B5, D1 — і C3 як ручна конструкція), <strong>два</strong> в Go відсутні як API (C4 — узагалі немає; C3 — немає примітива), і <strong>один</strong> взагалі не про ADK (E3 — це розгортання). Тобто основна маса каталогу Go-читачеві доступна — але саме там, де джерело найгучніше («RoutedAgent для failover»), у Go немає нічого.</div>
</section>

  <ul>
    <li><strong>Коли брати.</strong> Середовище відповідає непередбачувано: пошук нічого не знайшов, шлях заблоковано. ReAct робить <em>перепланування явним</em>, а слід міркувань — найкращий артефакт для дебагу в агентних системах узагалі.</li>

  <div class="note"><strong>Перехід між A1 і A2 — не питання смаку.</strong> A1 → A2 варто робити тоді, коли ви побачили в логах, що агент <em>помиляється й не помічає цього</em>: викликав інструмент, отримав порожню відповідь і поїхав далі так, ніби все гаразд. Явне «спостереження» в ReAct існує саме для цього моменту, і його ціна — приблизно втричі більше викликів моделі на ту саму задачу.</div>

    <li><strong>Коли брати.</strong> Три звернення до API, які не залежать одне від одного, не мають коштувати три послідовні round-trip-и. Варіант «голосування» — те саме питання кільком агентам — купує впевненість, якої один виклик дати не може.</li>
    <li><strong>Коли не брати.</strong> Залежні підзадачі (це B1) і розгортання, обмежені за вартістю. Найважче тут не розпаралелити, а <strong>злити</strong>: гілки будуть суперечити одна одній, і хтось має вирішити, хто правий.</li>
  </ul>

  <div class="risk"><strong>Два запобіжники, і лише один із них механічний.</strong> (1) <strong>Ліміт паралельності — ваша дисципліна.</strong> Ставте <code>workflow.WithMaxConcurrency(n)</code> на граф (або <code>maxConcurrency</code> в <code>NewParallelWorker</code>) <em>до</em> першого fan-out: шторм із rate-limit під навантаженням — передбачувана відмова, а не несподіванка. (2) <strong>Злиття через <code>JoinNode</code> — механічний обов'язок.</strong> Валідація графа відхиляє вузол, у який входить більше однієї <em>безумовної</em> дуги, якщо це не <code>*JoinNode</code>. Тобто «зберу гілки просто в наступний вузол» у Go не збереться взагалі.</div>

  <div class="note"><strong>Живий приклад у цьому репозиторії.</strong> <code>wiki-tools/internal/pipeline/selfimprove/selfimprove.go</code>: <code>AddFanOut(load, taxonomy, rdfNode, entity, trend)</code> → <code>AddFanIn(join, …)</code> → <code>merge</code>. Чотири осі аналізу сховища йдуть одночасно, зливаються через <code>JoinNode</code> і далі йдуть лінійним хвостом. Те саме в <code>wiki-tools/internal/pipeline/trend/trend.go</code>, де віяло розходиться прямо зі <code>workflow.Start</code>.</div>

  <div class="note"><strong>Повторний вхід — ваша відповідальність.</strong> <code>NodeConfig.RerunOnResume</code> керує тим, що станеться після відновлення: <code>&amp;true</code> перезапускає перерваний вузол <em>з початку</em>, <code>&amp;false</code> віддає відповідь наступнику як вхід, <code>nil</code> віддає рішення рушію. Для динамічних вузлів конструктор ставить <code>true</code> за замовчуванням — отже <strong>коректність залежить від того, чи ваш код безпечний до повторного відтворення</strong>. Усе, що має побічний ефект, має статися <em>після</em> відновлення, а не до переривання.</div>

  <p><strong>Намір:</strong> виконувати агента як фоновий процес, який активується подіями, а не ходом людини.</p>
  <ul>
    <li><strong>Коли брати.</strong> Тікети підтримки в черзі, файл, що впав у бакет, нічний звіт. Тригер-ендпойнти беруть на себе парсинг, сесію-на-подію, паралельність і ретраї — і прибирають цілий клас помилок обв'язки.</li>
    <li><strong>Коли не брати.</strong> Інтерактивні розмовні продукти. Це <strong>обгортка розгортання, а не патерн оркестрації</strong>: тілом може бути будь-який патерн A–D.</li>
  </ul>
  <div class="risk"><strong>Три наслідки, які завжди недооцінюють.</strong> (1) <strong>Ніхто не зловить погане рішення</strong> — людини в петлі немає за визначенням. (2) Сесія-на-подію означає, що пам'ять <em>між</em> подіями потребує memory-сервісу, а не стану сесії. (3) <strong>Відмова тиха, доки ви не збудуєте алертинг</strong> — і це та сама причина, з якої в цьому репозиторії діє правило: рядок підсумку, що звітує про нуль чи про збій, мусить називати причину.</div>
  <div class="note"><strong>Go-примітка.</strong> Примітива E3 в ADK немає й бути не може: <code>Pub/Sub</code>, <code>Eventarc</code> і <code>Cloud Scheduler</code> зі списку джерела — це GCP, а не ADK. Що ADK Go справді дає — транспорт: <code>server/adkrest</code>, <code>server/agentengine</code>, <code>server/adka2a</code>. Розклад, черга й ретраї доставки — поза модулем.</div>

  <h2>Запобіжники, про які варто знати заздалегідь</h2>
  <p>Ці перевірки спрацьовують на етапі <code>workflow.New</code> або першої активації — тобто <strong>до</strong> того, як щось коштуватиме грошей. Знати їх наперед дешевше, ніж зустріти в логах.</p>
  <ul>
    <li><code>ErrUnconditionalCycle</code> — цикл, у якому жодне ребро не несе маршруту.</li>
    <li><code>ErrMultipleDefaultRoutes</code> — два <code>Default</code>-ребра з одного вузла.</li>
    <li><code>validateFanIn</code> — більше однієї безумовної вхідної дуги у не-<code>JoinNode</code>.</li>
    <li><code>validateNoTaskModeGraphNodes</code> — Task-режимний агент статичним вузлом графа.</li>
    <li><code>validateUniqueNames</code>, <code>validateSubWorkflowNames</code> — колізії імен вузлів і підграфів.</li>
    <li><code>validateStartNodePresent</code>, <code>validateStartNodeNoIncoming</code>, <code>validateConnectivity</code> — граф без входу, вхід із вхідною дугою, недосяжні вузли.</li>
    <li><code>ErrInvalidRunNodeContext</code> — <code>RunNode</code> викликано поза динамічним вузлом.</li>
    <li><code>ErrParallelHITLUnsupported</code> — переривання в паралельних гілках.</li>
    <li><code>ErrOutputAlreadyDelegated</code> — друга спроба віддати вихід дитини як вихід батька.</li>
    <li><code>ErrInputValidation</code> — вхід вузла не пройшов схему.</li>
    <li>Вузол, що емітить <strong>два</strong> виходи за одну активацію, зазнає невдачі — вихід рівно один.</li>
  </ul>
  <div class="note"><strong>Читайте цей список як карту того, що вам <em>не</em> доведеться перевіряти вручну.</strong> І як карту того, що доведеться: усе, чого тут немає — ліміти ітерацій, ліміти паралельності, якість критика, порядок побічних ефектів — не має механічного запобіжника ні в Go, ні деінде.</div>
</section>

  <p>Каталог довелося <em>переписувати</em>, а не перевидавати, бо рушій змінив форму: ADK перейшов від ієрархічного виконавця агентів до <strong>рушія виконання графа</strong>, де агенти, інструменти й звичайні функції — усе це вузли. Однорядковий підсумок — <em>граф є агентом</em> — і є причиною, з якої всі патерни цієї сторінки композуються один з одним.</p>

  <div class="wrap">
  <table class="wide">
    <tr><th>Аспект</th><th>ADK 1.x</th><th>ADK 2.x</th></tr>
    <tr><td><strong>Модель виконання</strong></td><td>Ієрархічний виконавець агентів — дерево агентів</td><td>Рушій виконання графа — агенти, інструменти й функції є вузлами</td></tr>
    <tr><td><strong>Оркестрація</strong></td><td><code>SequentialAgent</code>, <code>ParallelAgent</code>, <code>LoopAgent</code></td><td>Граф + динамічні workflow; шаблонні агенти витіснено</td></tr>
    <tr><td><strong>Розгалуження</strong></td><td>Власний підклас <code>BaseAgent</code>, керування потоком руками</td><td>Типізовані маршрути: <code>StringRoute</code>, <code>IntRoute</code>, <code>BoolRoute</code>, <code>MultiRoute[T]</code>, <code>Default</code></td></tr>
    <tr><td><strong>Цикли</strong></td><td><code>LoopAgent</code> + прапорець escalate</td><td>Цикли — ребра графа, або звичайний цикл у динамічному вузлі</td></tr>
    <tr><td><strong>Людина в петлі</strong></td><td>Власний інструмент, що блокує</td><td>Вбудоване переривання/відновлення, довговічне через перезапуск процесу</td></tr>
    <tr><td><strong>Делегування</strong></td><td>Передача під-агенту, повернення руками</td><td>Режими агента: <code>ModeChat</code>, <code>ModeTask</code>, <code>ModeSingleTurn</code> — визначена семантика повернення й ізоляції</td></tr>

    <tr><td><strong>Контекст (Go)</strong></td><td><code>InvocationContext</code>, <code>ToolContext</code>, <code>CallbackContext</code></td><td>Єдиний <code>agent.Context</code> — ламка зміна</td></tr>
  </table>

  <h2>Два рядки, які в Go виглядають інакше, ніж каже джерело</h2>
  <ul>
    <li><strong>«Цикли — першокласні ребра».</strong> Формально так, але не будь-які: у Go v2.2.0 цикл легальний <em>лише якщо принаймні одне ребро в ньому несе маршрут</em>. Беззумовний цикл відхиляється як <code>ErrUnconditionalCycle</code> ще на етапі збирання графа. Ребро з <code>Default</code> при цьому рахується умовним.</li>
    <li><strong>«Task-режим вимкнено в графових workflow у Python v2.0.0».</strong> У Go v2.2.0 діє те саме обмеження й теж механічно — <code>validateNoTaskModeGraphNodes</code>. Отже це не особливість Python-SDK, як можна прочитати джерело, а властивість планувальника, спільна для обох.</li>
  </ul>

  <div class="risk"><strong>Що звідси випливає для матеріалів курсу.</strong> Будь-який приклад, написаний під 1.x, — це не «старий стиль», а <em>інша модель виконання</em>. Найдорожча помилка при перенесенні — залишити ієрархію агентів там, де 2.x чекає граф: воно запуститься, але ізоляція контексту й відновлення працюватимуть не так, як здається з коду. Пін <code>v2.2.0</code> тут — не формальність: перевіряйте кожен приклад проти зафіксованої версії перед записом, «станом на 08/2026».</div>
</section>

  <div class="risk"><strong>І чесна половина цього твердження: тринадцяти з шістнадцяти тут немає.</strong> Ані маршрутів (<code>AddRoutes</code> не використовується ніде), ані динамічних вузлів, ані HITL, ані під-агентів, ані режимів. Це не докір коду — це <em>підтвердження тези каталогу</em>: реальна робоча система осіла на найлівішому краю осі й не мала потреби рухатися праворуч. Якщо ваша система вже там, це добра новина, а не відставання.</div>

  <h2>Чек-лист перед тим, як назвати це архітектурою</h2>
  <ul>

<script>
(function () {
  'use strict';

  // Modules are authored inside <template> so the source stays readable; lift
  // them into the deck and let the .active class drive display + animation.
  var deck = document.getElementById('deck');
  var bar  = document.getElementById('progress');
  var tpl  = document.getElementById('src');
  var nav  = document.getElementById('toc');

  Array.prototype.forEach.call(tpl.content.querySelectorAll('section'), function (s) {
    s.classList.add('slide');
    deck.appendChild(document.importNode(s, true));
  });

  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var items  = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
  var i = 0;

  // Stagger is generated, never hand-maintained: authoring a --d on every block
  // is exactly the bookkeeping that rots when a section is inserted mid-page.
  slides.forEach(function (s) {
    var d = 0;
    Array.prototype.forEach.call(s.children, function (el) {
      el.classList.add('rise');
      el.style.setProperty('--d', d.toFixed(2) + 's');
      d = Math.min(d + 0.05, 0.6);
    });
  });

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    items.forEach(function (a, k) { a.classList.toggle('on', k === i); });
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    scrollTo(0, 0);
    var on = items[i];
    if (on && on.scrollIntoView) { on.scrollIntoView({block: 'nearest', inline: 'nearest'}); }
    try { location.hash = String(i + 1); } catch (e) {}
  }

  // One handler for both the sidebar and the overview cards: anything carrying
  // data-go is a jump target, so adding a link never means adding a listener.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    show(parseInt(a.dataset.go, 10));
  });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
    else if (e.key === 'o' || e.key === 'O') { show(0); }
    else if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen().catch(function () {}); }
    }
  });

  // Deep links: #7 opens module 6, and editing the hash live still works.
  addEventListener('hashchange', function () {
    var n = parseInt((location.hash || '#1').slice(1), 10) - 1;
    if (!isNaN(n) && n !== i) show(n);
  });

  show(parseInt((location.hash || '#1').slice(1), 10) - 1 || 0);
})();
</script>
