<title>ADK Go 2.x — Learning Deck</title>
<style>
/* ============================================================================
   ADK Go 2.x — single-file learning deck.
   Merged from the 14 per-module pages: one SPA, one file, no CDN, no webfonts,
   no JS libraries — it has to open from a USB stick with no network.

   Visual system: the Pi-Go design system (wiki-tools/internal/docsingest/
   shell/deck.css). Closed palette — deep-space navy grounds, neon cyan as the
   primary accent, magenta/purple/green secondaries. Moved off the Prometheus
   brandbook on 2026-08-30 with the rest of the shelf; courses/STYLE.md still
   governs the actual course decks under courses/.
   Light mode only, one plashka radius per макет.

   Deck chrome (nav, .rise staged reveal, progress, hash routing) is the same
   mechanism as courses/AI_Agents_Engineering/week0_open/slides.html.

   Keys: → / Space next · ← prev · O overview · F fullscreen · Home/End
   PDF:  Cmd-P → Save as PDF (backgrounds on) — every module prints in order.
   ========================================================================== */

:root{
  /* ── Pi-Go design system ──────────────────────────────────────────────
     Source of truth: the "Pi-Go Design System" project on claude.ai/design,
     mirrored for the app at internal/serve/static/theme.css. These tokens are
     INLINED rather than linked because a shelf document must open from a USB
     stick with no network (verify.go rule 3), and because it is published as
     a Gist or handed round as a file — nothing external may be fetched at
     render time.

     Same constraint kills the webfonts: the three families are named below so
     a machine that has them installed uses them, but there is no @font-face
     (the woff2 live behind the server, and @import is a verify.go error), so
     most readers see the fallback stacks. That is the accepted trade for
     portability — the palette, not the type, is what makes the shelf read as
     one set.

     This shelf used to carry the Prometheus brandbook (cream/peach/orange,
     light mode). It moved to Pi-Go on 2026-08-30: the shelf is a wiki reading
     surface viewed inside `wiki serve`, not a learner-facing Prometheus deck,
     so it follows the wiki's own system. courses/STYLE.md still governs actual
     course decks under courses/ — do not "align" those to this file. */

  /* surfaces */
  --bg:#0a0a12; --bg-alt:#0d0d1a; --panel:#0f0f1e; --code-bg:#0a0a14;
  /* neon palette */
  --cyan:#00f0ff; --magenta:#ff00aa; --purple:#b347ff;
  --green:#00ff88; --yellow:#ffe600; --orange:#ff6a00;
  /* foreground — no pure white anywhere */
  --ink:#e0e0f0; --ink-dim:#8888aa; --ink-faint:#555577; --code-text:#cdd6f4;

  --line:rgba(0,240,255,.12); --line-strong:rgba(0,240,255,.25);
  --wash:rgba(0,240,255,.08);   /* the lit surface: tags, notes, chips */
  --accent:var(--cyan); --accent-2:var(--magenta);
  --glow:0 0 20px rgba(0,240,255,.3), 0 0 60px rgba(0,240,255,.1);

  /* Sharp, not rounded: 2px for chips and controls, 4px for panels. Pills and
     heavy rounding are off-brand in this system, which is why --pill is 2px
     and not 999px — the name is kept so the rules below did not have to move. */
  --radius:4px;
  --pill:2px;
  --nav-w:264px;
  --font-display:'Orbitron','SF Mono',ui-monospace,monospace;
  --font-body:'Rajdhani',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;
     -webkit-font-smoothing:antialiased}
/* The system's two signature textures: a fixed 60px grid floor behind
   everything and a 2px scanline wash above it. Both are pointer-events:none
   and neither animates, so they survive the reduced-motion block untouched. */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);
  background-size:60px 60px}
body::after{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,
             rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px)}
::selection{background:var(--magenta);color:#000}

/* ---- navigation ---------------------------------------------------------- */

#toc{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);z-index:50;
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:1.1rem .8rem 2rem;
}
#toc .toc-h{
  font-family:var(--font-display);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--cyan);border-left:2px solid var(--cyan);padding-left:9px;margin:.2rem 0 .8rem 4px;
}
.nav-item{
  display:flex;align-items:baseline;gap:.55rem;
  padding:.42rem .6rem;margin-bottom:2px;border-radius:var(--radius);
  text-decoration:none;color:var(--ink-dim);font-size:.9rem;
  border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;
}
.nav-item:hover{background:var(--wash);color:var(--ink)}
.nav-item.on{background:var(--wash);border-color:var(--line-strong);color:var(--cyan);font-weight:600}
.n-num{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);flex:none}
.nav-item.on .n-num{color:var(--cyan)}
.n-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* emoji carry almost no right sidebearing, so the gap is set here, not typed
   as a space in the markup where it visually collapses against the glyph. */
.n-e,.c-e{margin-right:.4em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.c-e{font-weight:400}

/* ---- deck ---------------------------------------------------------------- */

#deck{margin-left:var(--nav-w);padding:3rem 1.5rem 5rem;position:relative;z-index:1}
.slide{max-width:1000px;margin:0 auto;display:none}
.slide.active{display:block;animation:slide-in .32s ease both}
@keyframes slide-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* staged reveal: each block fades up in sequence once its slide is active.
   --d is assigned in JS so authored markup stays free of stagger bookkeeping. */
.slide.active > .rise{animation:rise .5s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.crumb{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.5rem}
h1{font-size:2.2rem;color:var(--cyan);margin-bottom:.3rem;font-family:var(--font-display);text-transform:uppercase;font-weight:800;letter-spacing:.5px;text-shadow:0 0 10px rgba(0,240,255,.5),0 0 30px rgba(0,240,255,.2)}
.cover h1{font-size:2.4rem}
.h-emoji{text-transform:none;font-weight:400;margin-right:.22em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.subtitle{color:var(--ink-dim);font-size:1.05rem;margin-bottom:1.5rem}
.module{color:var(--cyan);font-family:var(--mono);font-size:.95rem;margin-bottom:1.2rem;word-break:break-word}
h2{font-size:1.3rem;color:var(--ink);margin:2rem 0 .7rem;font-family:var(--font-display);text-transform:uppercase;font-weight:800;letter-spacing:1px;padding-bottom:.3em;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--cyan),transparent) 1}
h3{font-size:1.05rem;color:var(--ink);font-weight:700;margin-bottom:.4rem}
p{color:var(--ink-dim);margin-bottom:.8rem;max-width:70ch}
.muted{color:var(--ink-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin:1rem 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
/* the sidebar narrows the content column vs. the old standalone pages, so long
   mono identifiers (workflow.NewEmittingFunctionNode) must be allowed to wrap
   rather than run past the card border. */
.card h3{font-size:1rem;color:var(--cyan);margin-bottom:.4rem;font-family:var(--mono);overflow-wrap:anywhere}
.card p{font-size:.9rem;color:var(--ink-dim);margin:0}
a.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .15s,box-shadow .15s,transform .15s}
/* Hover lifts and glows — depth comes from light outside the element, never
   from an inner shadow. */
a.card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--glow)}
a.card .path{display:block;font-size:.75rem;color:var(--ink-faint);margin-top:.4rem;font-family:var(--mono)}
.tag{display:inline-block;background:var(--wash);color:var(--cyan);border:1px solid var(--line-strong);border-radius:var(--pill);padding:.1rem .6rem;font-size:.75rem;margin:.15rem .15rem 0 0;font-family:var(--mono)}
.badge{display:inline-block;background:var(--wash);color:var(--cyan);border:1px solid var(--line-strong);border-radius:var(--pill);padding:.1rem .6rem;font-size:.75rem;margin-left:.4rem;vertical-align:middle;text-transform:none;font-weight:400}
svg{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;height:auto;display:block;margin:1rem 0}

/* ---- diagram vocabulary -------------------------------------------------- */
/* One vocabulary across all modules: the learner should recognise the same
   shapes module to module. Every edge endpoint is computed from node geometry
   by the generator, never typed by hand.
   Node kinds are now told apart by their neon STROKE on a shared dark fill,
   where the Prometheus version told them apart by stroke on white — same
   mechanism, inverted ground. */
.dg-frame{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
.dg-ti{fill:var(--ink-faint);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.dg-lb{fill:var(--ink);font-weight:700}
.dg-sb{fill:var(--ink-dim);font-size:11.5px}
.dg-el{fill:var(--ink-faint);font-size:11px}
.dg-head{fill:var(--ink-faint)}
.dg-link{stroke:var(--ink-faint);stroke-width:1.8;fill:none}
.dg-link-warm{stroke:var(--magenta)}
.dg-dash{stroke-dasharray:5 5}

/* node kinds — closed palette, no invented colors */
.dg-b-model{fill:var(--bg-alt);stroke:var(--purple);stroke-width:1.8}
.dg-b-out  {fill:var(--bg-alt);stroke:var(--magenta);stroke-width:1.8}
.dg-b-tool {fill:var(--bg-alt);stroke:var(--green);stroke-width:1.8}
.dg-b-pill {fill:var(--bg-alt);stroke:var(--cyan);stroke-width:1.8}
.dg-b-ghost{fill:var(--bg-alt);stroke:var(--line);stroke-width:1.5}
.dg-b-group{fill:none;stroke:var(--line);stroke-width:1.5}
.dg-dot{fill:var(--cyan)}

/* ---- diagram animation --------------------------------------------------- */
/* All of it is gated on .slide.active so only the visible module animates —
   fourteen diagrams ticking at once in a hidden section is wasted paint. */

/* a dash that crawls along a path = "data is moving here" */
.flow{stroke-dasharray:7 9;stroke-linecap:round}
.slide.active .flow{animation:crawl 1.1s linear infinite}
@keyframes crawl{to{stroke-dashoffset:-32}}

/* a packet riding the happy path, for the one-shot request/response */
.packet{opacity:0}
.slide.active .packet{animation:ride var(--dur,2.6s) cubic-bezier(.5,0,.5,1) infinite}
@keyframes ride{
  0%{offset-distance:0%;opacity:0}
  8%{opacity:1}
  92%{opacity:1}
  100%{offset-distance:100%;opacity:0}
}

/* a dot orbiting a closed cycle — the plan/act loop */
.slide.active .orbit{animation:orbit 3.6s linear infinite}
@keyframes orbit{to{offset-distance:100%}}

/* node that pulses as the loop passes through it */
.slide.active .beat{animation:beat 3.3s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes beat{
  0%,70%,100%{filter:none}
  78%{filter:drop-shadow(0 0 7px rgba(0,240,255,.85))}
  90%{filter:none}
}
ul{margin:0 0 .8rem 1.3rem}
li{margin-bottom:.35rem;color:var(--ink-dim)}
li::marker{color:var(--cyan)}
code{background:var(--wash);border:0;border-radius:2px;padding:.1rem .35rem;font-family:var(--mono);font-size:.85em;color:var(--cyan)}
/* A code block is the one place a DARK shadow is on-brand: it is a depressed
   element, so it recedes instead of glowing. */
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;overflow-x:auto;margin:.8rem 0;box-shadow:0 2px 12px rgba(0,0,0,.4)}
pre code{background:none;border:none;padding:0;color:var(--code-text);display:block}
.note{border-left:2px solid var(--accent-2);background:rgba(255,0,170,.06);padding:.8rem 1rem;border-radius:0 var(--radius) var(--radius) 0;margin:1rem 0;font-size:.92rem;color:var(--ink)}

/* ---- chrome -------------------------------------------------------------- */

#progress{position:fixed;left:0;top:0;height:2px;background:var(--cyan);z-index:60;transition:width .3s ease;box-shadow:0 0 10px rgba(0,240,255,.6)}
#help{position:fixed;right:14px;top:12px;z-index:60;font-size:12px;color:var(--ink-faint)}

@media (prefers-reduced-motion:reduce){
  .slide.active,.slide.active > .rise,
  .slide.active .flow,.slide.active .packet,.slide.active .orbit,.slide.active .beat{animation:none!important}
  .packet{opacity:1}
}

/* ---- mobile: sidebar becomes a scrollable strip -------------------------- */

@media (max-width:900px){
  :root{--nav-w:0px}
  #toc{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);
       display:flex;gap:.35rem;overflow-x:auto;padding:.6rem .8rem;white-space:nowrap;
       position:relative;z-index:1}
  #toc .toc-h{display:none}
  .nav-item{flex:none;margin:0}
  .n-t{max-width:42vw}
  #deck{margin-left:0;padding:1.6rem 1rem 4rem}
  #help{display:none}
  h1{font-size:1.7rem}
}

/* ---- print → PDF: every module, in order --------------------------------- */
/* The deck is dark on screen and PAPER in print. This block is not cosmetic:
   the rules below set print-color-adjust:exact, so without it a #0a0a12 page
   background is faithfully reproduced and every sheet comes out solid black.
   So print re-grounds the whole document — light paper, dark ink — and keeps
   only the accent hues, which read fine on white. The textures go entirely:
   a scanline overlay is a screen effect and prints as grey banding. */
@media print{
  @page{margin:14mm}
  :root{
    --bg:#ffffff; --bg-alt:#ffffff; --panel:#ffffff; --code-bg:#f4f4f8;
    --ink:#0a0a12; --ink-dim:#33333f; --ink-faint:#666677; --code-text:#0a0a12;
    --line:#c8c8d4; --line-strong:#9a9ab0; --wash:#eef9fb;
    --glow:none;
  }
  body{background:#ffffff;color:#0a0a12}
  body::before,body::after{display:none!important}
  h1{color:#0a0a12;text-shadow:none}
  h2{color:#0a0a12;border-image:none;border-bottom:1px solid #c8c8d4}
  /* Neon cyan is invisible on white, so the accent darkens to a teal that
     still reads as "the accent colour" but survives a laser printer. */
  .module,.card h3,code,.tag,.badge{color:#005f6b}
  pre{box-shadow:none}
  #progress{box-shadow:none}
  #toc,#progress,#help{display:none!important}
  #deck{margin:0;padding:0}
  .slide{display:block!important;page-break-after:always;break-after:page;max-width:none}
  .slide *{animation:none!important;opacity:1!important;transform:none!important}
  .packet{opacity:1}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<section>
  <div class="crumb">MODULE 1 of 14</div>
  <h1><span class="h-emoji">🤖</span> agents</h1>
  <div class="module">google.golang.org/adk/v2/agent · /agent/llmagent · /agent/sequentialagent · /agent/parallelagent · /agent/loopagent · /agent/workflowagent</div>
  <p>The fundamental worker units of ADK. An agent either reasons over an LLM (<code>llmagent.New</code>) or deterministically orchestrates sub-agents/tasks (<code>sequentialagent</code>, <code>parallelagent</code>, <code>loopagent</code>). In ADK Go 2.0 every agent implements the <code>agent.Agent</code> interface and is evaluated as a node inside the Workflow Graph engine.</p>

  <h2>Hierarchy &amp; execution model</h2>
  <svg viewBox="0 0 760 340" role="img" aria-label="agent hierarchy">

  <h2>Key components</h2>
  <div class="grid">
    <div class="card"><h3>agent.Agent</h3><p>Interface every agent implements: Name(), Description(), Run(ctx, ...) and the node contract.</p></div>
    <div class="card"><h3>agent.Context</h3><p>Runtime handle for the current invocation: session, state, events, artifacts, memory, credentials.</p></div>
    <div class="card"><h3>agent.Config</h3><p>Shared base config: Name, Description, SubAgents, callbacks.</p></div>
    <div class="card"><h3>agent.RunConfig</h3><p>Per-run tuning: StreamingMode, max LLM calls, telemetry, labels.</p></div>
    <div class="card"><h3>llmagent.Config</h3><p>Model, Instruction, Tools, Input/OutputKey, planner, callbacks.</p></div>
    <div class="card"><h3>agent.NewSingleLoader</h3><p>Wraps one agent for the launcher/CLI entry point.</p></div>
  </div>

  <h2>Use cases</h2>
  <ul>
    <li><strong>llmagent.New</strong> — a conversational agent with tools, an instruction, and structured input/output (the common default).</li>
    <li><strong>sequentialagent.New</strong> — a fixed pipeline (e.g. extract → enrich → summarize) where each stage hands off to the next.</li>
    <li><strong>parallelagent.New</strong> — fan out independent sub-tasks (e.g. analyze multiple reports at once) and merge results.</li>
    <li><strong>loopagent.New</strong> — repeat a step until a condition is met.</li>
    <li><strong>workflowagent.New</strong> — wrap a graph-based workflow as a standard <code>agent.Agent</code>.</li>
  </ul>

  <div class="note"><strong>2.0 migration note:</strong> custom execution must move from <code>Run</code> overrides into <code>BeforeAgentCallback</code> / <code>AfterAgentCallback</code> hooks. The graph engine bypasses legacy execution overrides.</div>

  <h2>Quick sketch</h2>
  <pre><code>import (
    "google.golang.org/adk/v2/agent"
    "google.golang.org/adk/v2/agent/llmagent"
    "google.golang.org/adk/v2/model/gemini"
    "google.golang.org/adk/v2/tool"
    "google.golang.org/adk/v2/tool/geminitool"
    "google.golang.org/genai"
)

model, _ := gemini.NewModel(ctx, "gemini-flash-latest", &amp;genai.ClientConfig{
    APIKey: os.Getenv("GOOGLE_API_KEY"),
})

timeAgent, _ := llmagent.New(llmagent.Config{
    Name:        "hello_time_agent",
    Model:       model,
    Description: "Tells the current time in a specified city.",
    Instruction: "You are a helpful assistant that tells the current time in a city.",
    Tools:       []tool.Tool{geminitool.GoogleSearch{}},
})

config := &amp;launcher.Config{AgentLoader: agent.NewSingleLoader(timeAgent)}
full.NewLauncher().Execute(ctx, config, os.Args[1:])</code></pre>
  <p class="muted">See also: <code>workflow</code> (2.0 graph engine), <code>tool</code>, callbacks/plugins.</p>

  <h1><span class="h-emoji">🔀</span> workflow <span class="badge">NEW in 2.0</span></h1>
  <div class="module">google.golang.org/adk/v2/workflow · /agent/workflowagent</div>
  <p>The heart of ADK Go 2.0 — a <strong>graph-based execution engine</strong> that replaces the 1.x hierarchical agent executor. Agents, tools, and functions are all evaluated as <strong>nodes</strong> in a directed graph connected by <strong>edges</strong>. This gives you deterministic, predictable control over how tasks are routed and executed.</p>

  <h2>Key components</h2>
  <div class="grid">
    <div class="card"><h3>workflow.NewFunctionNode</h3><p>Wraps a plain Go function as a node; its return value becomes <code>event.Output</code> forwarded to the next node.</p></div>
    <div class="card"><h3>workflow.NewAgentNode</h3><p>Wraps an <code>agent.Agent</code> as a node in the graph.</p></div>
    <div class="card"><h3>workflow.NewEmittingFunctionNode</h3><p>A function node that can emit events (e.g. set <code>ev.Routes</code> for routing).</p></div>
    <div class="card"><h3>workflow.NewJoinNode</h3><p>Joins branches after parallel fan-out, waiting for all inputs.</p></div>
    <div class="card"><h3>workflow.Edge</h3><p>Directed link with optional <code>Route</code> matcher for conditional dispatch.</p></div>
    <div class="card"><h3>workflow.Chain / Concat</h3><p>Helpers to wire nodes into a sequential <code>[]workflow.Edge</code> slice.</p></div>
    <div class="card"><h3>workflow.StringRoute / IntRoute / BoolRoute</h3><p>Route matchers checked against <code>event.Routes</code>.</p></div>
    <div class="card"><h3>workflowagent.New</h3><p>Wraps the whole graph as a standard <code>agent.Agent</code>.</p></div>
  </div>

  <h2>Use cases</h2>
  <ul>
    <li><strong>Deterministic pipelines</strong> — a fixed sequence of processing stages with a clear start/end.</li>
    <li><strong>Conditional routing</strong> — branch on a node's output via <code>workflow.StringRoute</code> edges for decision logic.</li>
    <li><strong>Parallel fan-out / join</strong> — run multiple sub-tasks concurrently and gather results.</li>
    <li><strong>Dynamic / iterative workflows</strong> — code-based control flow (loops, complex branching).</li>
    <li><strong>Robustness</strong> — automatic retries and HITL pauses per node.</li>
  </ul>

  <div class="note"><strong>Why it matters:</strong> the graph engine gives the framework strict control over event emission, state, routing, and streaming. Data flows between nodes via <code>event.Output</code> — no session-state writes needed. Emit events from your node rather than appending to the session.</div>

  <h2>Quick sketch</h2>
  <pre><code>import (
    "google.golang.org/adk/v2/agent"
    "google.golang.org/adk/v2/agent/workflowagent"
    "google.golang.org/adk/v2/workflow"
)

cityGen := workflow.NewFunctionNode("city_generator_agent",
    func(_ agent.Context, _ any) (string, error) { return "Tokyo", nil },
    workflow.NodeConfig{})

lookup := workflow.NewFunctionNode("lookup_time_function",
    func(_ agent.Context, city string) (cityTime, error) {
        return cityTime{City: city, TimeInfo: "10:10 AM"}, nil
    }, workflow.NodeConfig{})

return workflowagent.New(workflowagent.Config{
    Name:  "root_agent",
    Edges: workflow.Chain(workflow.Start, cityGen, lookup),
})</code></pre>
  <p class="muted">See also: <code>agents</code> (agents as nodes), graphs docs, dynamic &amp; parallel workflow guides.</p>
</section>

  <h2>Key components</h2>
  <div class="grid">
    <div class="card"><h3>tool.Tool</h3><p>Interface: Name(), Description(), Run(ctx, args). Schema derived from struct tags.</p></div>
    <div class="card"><h3>functiontool.New</h3><p>Wraps a Go function as a tool; typed input/output structs define the schema.</p></div>
    <div class="card"><h3>agenttool.New</h3><p>Expose another agent as a tool so one agent delegates to a sub-agent.</p></div>
    <div class="card"><h3>geminitool.GoogleSearch</h3><p>Built-in Google Search tool for grounding.</p></div>
    <div class="card"><h3>Struct tags</h3><p><code>json</code> (required/optional via omitempty) + <code>jsonschema</code> (description).</p></div>
    <div class="card"><h3>agent.Context</h3><p>Injected into tool funcs for session state, artifacts, credentials.</p></div>
  </div>

  <h2>Use cases</h2>
  <ul>
    <li><strong>functiontool.New</strong> — give an agent a bespoke function (search, calculator, internal lookup).</li>
    <li><strong>agenttool.New</strong> — hierarchical delegation: a coordinator calls specialist sub-agents.</li>
    <li><strong>geminitool.GoogleSearch</strong> — ground answers with live web search.</li>
    <li><strong>MCP / OpenAPI</strong> — reuse the MCP ecosystem or any REST API.</li>
  </ul>

  <div class="note"><strong>Go schema rules:</strong> a field is <em>required</em> if its <code>json</code> tag has no <code>omitempty</code>/<code>omitzero</code>; <em>optional</em> if it does. Use <code>jsonschema</code> tags to describe each argument for the LLM.</div>

  <h2>Quick sketch</h2>
  <pre><code>type getStockPriceArgs struct {
    Symbol string `json:"symbol" jsonschema:"The stock ticker symbol, e.g., GOOG"`
}
type getStockPriceResults struct {
    Symbol string  `json:"symbol"`
    Price  float64 `json:"price,omitempty"`
    Error  string  `json:"error,omitempty"`
}
func getStockPrice(ctx agent.Context, input getStockPriceArgs) (getStockPriceResults, error) {
    return getStockPriceResults{Symbol: input.Symbol, Price: 300.6}, nil
}

stockPriceTool, _ := functiontool.New(functiontool.Config{
    Name: "get_stock_price", Description: "Retrieves the current stock price.",
}, getStockPrice)

agent, _ := llmagent.New(llmagent.Config{
    Name: "stock_agent", Model: model, Tools: []tool.Tool{stockPriceTool},
})</code></pre>

  <h2>Key components</h2>

    <div class="card"><h3>session.Service</h3><p>Abstract persistence contract (Create/Get/List/Delete/AppendEvent).</p></div>
    <div class="card"><h3>session.InMemoryService</h3><p>In-memory store — great for tests/prototyping.</p></div>

  <h2>Use cases</h2>
  <ul>
    <li>Maintain multi-turn context — a chat agent that remembers prior turns across requests.</li>
    <li>Persist state so an agent can resume a task (e.g. a multi-step workflow) later.</li>
    <li>User-scoped conversations via <code>UserID</code> for per-user session isolation.</li>
    <li>InMemoryService for fast local dev/tests; a custom <code>session.Service</code> for production.</li>
  </ul>

  <div class="note"><strong>2.0 note:</strong> the Event struct added <code>IsolationScope</code>, <code>Routes</code>, <code>RequestedInput</code>, <code>Output</code>, <code>NodeInfo</code>. If you store sessions in a rigid DB schema (explicit columns), update it to accommodate the new fields.</div>

  <h2>Quick sketch</h2>
  <pre><code>import "google.golang.org/adk/v2/session"

svc := session.InMemoryService()
sess, err := svc.Create(ctx, &amp;session.CreateRequest{
    AppName: "myapp",
    UserID:  "u1",
})
sessionID := sess.Session.ID()
// pass svc to runner.Config.SessionService</code></pre>
  <p class="muted">See also: <code>events</code>, memory (long-term), <code>runner</code>.</p>
</section>

  <div class="grid">
    <div class="card"><h3>session.Event</h3><p>Core event: content, author, actions, plus 2.0 graph fields.</p></div>
    <div class="card"><h3>session.NewEvent</h3><p>Constructor; in 2.0 requires <code>context.Context</code> as the first argument.</p></div>
    <div class="card"><h3>Event.Actions</h3><p>Control signals: transfer, route, escalate, state delta, rewind, request input.</p></div>
    <div class="card"><h3>RequestInput</h3><p>Represents a paused node asking for human input (HITL) with a response schema.</p></div>
  </div>

  <h2>Use cases</h2>
  <ul>
    <li>Streaming UIs subscribe to events to render replies/tool progress live.</li>
    <li>Agents set <code>Actions.TransferToAgent</code> to hand off to another agent.</li>
    <li>2.0 <code>Routes</code> + <code>NodeInfo</code> drive graph edge dispatch and node tracking.</li>
    <li><code>RequestedInput</code> pauses a workflow node for human-in-the-loop input.</li>
  </ul>

  <div class="note"><strong>2.0 breaking change:</strong> <code>session.NewEvent</code> now takes a <code>context.Context</code> first: <code>ev := session.NewEvent(ctx, ctx.InvocationID())</code>. The old parameterless form and <code>NewEventWithContext</code> are removed.</div>

  <h2>Quick sketch</h2>
  <pre><code>import "google.golang.org/adk/v2/session"

ev := session.NewEvent(ctx, ctx.InvocationID())
ev.Routes = []string{"BUG"}   // drives edge dispatch
ev.Output = msg               // forward data to the next node
// in an emitting node: emit(ev) so the engine manages persistence</code></pre>

    <li>Persist across turns with a real session service attached to the runner.</li>

  <h2>Quick sketch</h2>
  <pre><code>import "google.golang.org/adk/v2/runner"

r, _ := runner.New(runner.Config{

    SessionService: session.InMemoryService(),
})

userMsg := genai.NewContentFromText("hi", genai.RoleUser)

    StreamingMode: agent.StreamingModeNone,
}) {
    if err != nil { fmt.Println("AGENT_ERROR:", err); continue }
    for _, p := range event.Content.Parts { fmt.Print(p.Text) }
}</code></pre>

  <div class="module">google.golang.org/adk/v2/agent (callbacks) · /plugin</div>

  <h2>Key components</h2>
  <div class="grid">
    <div class="card"><h3>Before/AfterAgentCallback</h3><p>Hooks around agent execution — the 2.0 way to inject custom logic.</p></div>
    <div class="card"><h3>Model &amp; Tool callbacks</h3><p>before/after model and tool calls; on-model-error / on-tool-error.</p></div>
    <div class="card"><h3>Plugin</h3><p>Reusable bundle of lifecycle hooks attached to a runner/agent.</p></div>
  </div>

  <h2>Use cases</h2>
  <ul>
    <li><strong>Guardrails</strong> — block or modify a tool call before execution.</li>
    <li><strong>Observability</strong> — log events, tool calls, and errors to a monitoring backend.</li>
    <li><strong>Auth / context injection</strong> — set credentials or state at run start.</li>
    <li><strong>Retries &amp; policy</strong> — react to tool/model errors with custom behavior.</li>
    <li><strong>Reusable cross-agent behavior</strong> — package a plugin and attach to many agents.</li>
  </ul>

  <div class="note"><strong>2.0 guidance:</strong> move custom execution logic out of <code>Run</code> overrides into <code>BeforeAgentCallback</code> / <code>AfterAgentCallback</code> hooks — the graph engine bypasses legacy overrides. This is the supported extension point.</div>

  <h2>Quick sketch</h2>
  <pre><code>import "google.golang.org/adk/v2/agent"

// Implement agent.BeforeAgentCallback / AfterAgentCallback
type guard struct{}
func (guard) BeforeAgentCallback(ctx agent.Context, invocation *agent.Invocation) error {
    // inspect / modify the invocation before the agent runs
    return nil
}

agent, _ := llmagent.New(llmagent.Config{
    Name: "root", Model: model,
    BeforeAgentCallbacks: []agent.BeforeAgentCallback{guard{}},
})</code></pre>
  <p class="muted">See also: <code>agents</code>, <code>tools</code>, <code>runner</code>, <code>events</code>.</p>

  <div class="grid">
    <div class="card"><h3>skill.Skill</h3><p>Name, description, instructions, resources (references/assets/scripts).</p></div>
    <div class="card"><h3>skill.Registry</h3><p>Discovers and fetches skills by name/description.</p></div>
    <div class="card"><h3>SkillToolset</h3><p>Exposes skills to an agent as tools: list/search/load/run-script.</p></div>
    <div class="card"><h3>Loaders</h3><p>Load skills from a local dir or GCS.</p></div>
  </div>

  <h2>Use cases</h2>
  <ul>
    <li>Package a domain procedure (e.g. "summarize financial docs") as a reusable skill.</li>
    <li>Share skills across agents or teams via a registry or GCS.</li>
    <li>Let an agent discover and load the right skill dynamically via a search tool.</li>
  </ul>

  <div class="note">Skills differ from tools: a skill is a bundled <em>instruction set</em> (with supporting files) that teaches an agent how to do something, whereas a tool is a directly callable function. ADK also integrates Google Cloud Skill Registry for managed skills.</div>

  <h2>Quick sketch</h2>
  <pre><code>import "google.golang.org/adk/v2/skill"

// Load a skill from a directory (SKILL.md + files)
s, err := skill.LoadFromDir(ctx, "path/to/my_skill")

// Attach skills to an agent via a SkillToolset
agent, _ := llmagent.New(llmagent.Config{
    Name: "root", Model: model,
    Tools: []tool.Tool{skill.NewToolset(s)},
})</code></pre>

</template>

<script>
(function () {
  'use strict';

  // Modules are authored inside <template> so the source stays readable; lift
  // them into the deck and let the .active class drive display + animation.
  var deck = document.getElementById('deck');
  var bar  = document.getElementById('progress');
  var tpl  = document.getElementById('src');
  var nav  = document.getElementById('toc');

  Array.prototype.forEach.call(tpl.content.querySelectorAll('section'), function (s) {
    s.classList.add('slide');
    deck.appendChild(document.importNode(s, true));
  });

  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var items  = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
  var i = 0;

  // Stagger is generated, never hand-maintained: authoring a --d on every block
  // is exactly the bookkeeping that rots when a section is inserted mid-page.
  slides.forEach(function (s) {
    var d = 0;
    Array.prototype.forEach.call(s.children, function (el) {
      el.classList.add('rise');
      el.style.setProperty('--d', d.toFixed(2) + 's');
      d = Math.min(d + 0.05, 0.6);
    });
  });

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    items.forEach(function (a, k) { a.classList.toggle('on', k === i); });
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    scrollTo(0, 0);
    var on = items[i];
    if (on && on.scrollIntoView) { on.scrollIntoView({block: 'nearest', inline: 'nearest'}); }
    try { location.hash = String(i + 1); } catch (e) {}
  }

  // One handler for both the sidebar and the overview cards: anything carrying
  // data-go is a jump target, so adding a link never means adding a listener.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    show(parseInt(a.dataset.go, 10));
  });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
    else if (e.key === 'o' || e.key === 'O') { show(0); }
    else if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen().catch(function () {}); }
    }
  });

  // Deep links: #7 opens module 6, and editing the hash live still works.
  addEventListener('hashchange', function () {
    var n = parseInt((location.hash || '#1').slice(1), 10) - 1;
    if (!isNaN(n) && n !== i) show(n);
  });

  show(parseInt((location.hash || '#1').slice(1), 10) - 1 || 0);
})();
</script>
