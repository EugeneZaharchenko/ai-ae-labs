# Plain BYO agent — no sandbox. Demo step 2: "the harness is now a cluster agent".
# Shape from kagent docs (examples/a2a-byo) · apiVersion kagent.dev/v1alpha2 · verified 2026-10-21 against kagent v0.10.1.
# kagent runs the image and expects A2A on port 8080 — which is what week6/part6/cmd serves.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: refund-harness
  namespace: kagent
spec:
  description: LEDGERWORKS refund assistant — the course harness (surface guard, egress probe).
  type: BYO
  byo:
    deployment:
      image: REGISTRY/refund-harness:0.1.0   # replace REGISTRY with your registry
      env:
        - name: A2A_WIRE
          value: "0.3"                         # kagent v0.10.1 pins a2a-go v0.3.15; use "1.0" on kagent main
        # Remove the -offline stand-in by giving the harness a real model key:
        # - name: GOOGLE_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: kagent-google
        #       key: GOOGLE_API_KEY
