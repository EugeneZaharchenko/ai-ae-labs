# agentgateway in front of every pi-go provider and the three coding agents,
# with Postgres behind it for the request log and Jaeger for trace collection.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# To reuse pi-go's own keys instead of a second copy of them:
#   docker compose --env-file ../../.pi-go/.env up -d
#
# LLM endpoint: http://localhost:4000     UI: http://localhost:4000/ui
# Traces:       http://localhost:16686    (JAEGER_UI_PORT moves the host port)

services:
  agentgateway:
    # Pinned rather than :latest so a config that validates today keeps working.
    # config/agentgateway.yaml needs >= v1.5.0 (modelCatalog, provider presets).
    image: ghcr.io/agentgateway/agentgateway:v1.5.0
    container_name: agentgateway
    restart: unless-stopped
    ports:
      # Loopback only: the host reaches it at 127.0.0.1:4000 for local CLI use,
      # and Tailscale serve exposes it externally on port 6000.
      - "127.0.0.1:4000:4000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Google's OpenAI-compatible endpoint, not the native one — see
      # CLAUDE.md "Gemini must go through the OpenAI-compatible endpoint".
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # MCP: Tavily's remote server takes its key in the URL query.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # The name config/agentgateway.yaml interpolates. Passing the legacy _1/_2/_3 names
      # here would leave the container with no OLLAMA_API_KEY at all, and the
      # gateway then sends an empty bearer token to ollama.com — a 401 that
      # reads as "bad key" when the key was never handed over.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # localhost inside a container is the container, so reach the host's
      # Ollama explicitly. Linux needs the extra_hosts entry below.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      AZUREOPENAI_API_KEY: ${AZUREOPENAI_API_KEY:-}
      # Bonsai 2 (ternary 27B) served on the HOST by hack/mlx/start-bonsai2-27b-mlx.sh.
      # host.docker.internal, not localhost: see extra_hosts below.
      PRISMML_BASE_URL: ${PRISMML_BASE_URL:-http://host.docker.internal:8477/v1}
      PRISMML_API_KEY: ${PRISMML_API_KEY:-local}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      # The config default points at localhost, which is right for run.sh but
      # wrong in a container: here Postgres is a sibling service.
      AGENTGATEWAY_DATABASE_URL: postgresql://agentgateway:agentgateway@postgres:5432/agentgateway
      AGENTGATEWAY_STORAGE_MODE: ${AGENTGATEWAY_STORAGE_MODE:-file}
      # Required, and deliberately has no default. config/agentgateway.yaml uses the bare
      # ${AGENTGATEWAY_API_KEY} for llm.policies.apiKey, so an empty value would
      # register an empty key that strict mode then accepts. `:?` makes compose
      # refuse to start with a readable message instead of crash-looping the
      # container on "error looking key 'AGENTGATEWAY_API_KEY' up".
      AGENTGATEWAY_API_KEY: ${AGENTGATEWAY_API_KEY:?set AGENTGATEWAY_API_KEY in your env file (see .env.example)}
      # Catalog paths, resolved against working_dir inside the container.
      AGENTGATEWAY_BASE_COSTS: ${AGENTGATEWAY_BASE_COSTS:-./base-costs.json}
      AGENTGATEWAY_PI_ALIASES: ${AGENTGATEWAY_PI_ALIASES:-./pi-aliases.json}
      # The Jaeger OTLP collector, as a compose-network name — not localhost,
      # which inside this container would point at the gateway itself. This is
      # what config/agentgateway.yaml interpolates into `tracing.otlpEndpoint`.
      #
      # Deliberately NOT OTEL_EXPORTER_OTLP_ENDPOINT. That name is a standard
      # one other tools set, and an inherited value would silently win over the
      # default here: `OTEL_EXPORTER_OTLP_ENDPOINT=127.0.0.1:4317` (which pi-go
      # exports) has no scheme and points at the gateway itself inside its own
      # container, so tracing would break with a parse error rather than a
      # missing-collector message. A namespaced name cannot collide.
      AGENTGATEWAY_OTLP_ENDPOINT: ${AGENTGATEWAY_OTLP_ENDPOINT:-http://jaeger:4317}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The DIRECTORY, not the three files inside it. A single-file bind mount
      # binds one inode. Replacing that file on the host by unlink-then-create
      # — what a `git checkout` of a deleted file and many editors' save do —
      # leaves the container holding a mount that resolves to nothing, and
      # every read, write and watch of it fails:
      #
      #   warn  failed to watch path /etc/agentgateway/base-costs.json: No path was found.
      #   error Failed to reload config: failed to read from file
      #         `/etc/agentgateway/config/agentgateway.yaml`: No such file or directory (os error 2)
      #   failed to write to file `./base-costs.json`: No such file or directory (os error 2)
      #
      # Replacing it by rename-over survives, so this fails intermittently
      # depending on which tool touched the file last — and the gateway keeps
      # serving whatever it loaded at boot, so it reads as "refresh costs is
      # broken" rather than as a crash. A single-file mount also refuses the
      # reverse: an atomic save from *inside* the container cannot rename onto
      # its own mount point (EBUSY, "Device or resource busy").
      #
      # Mounting the directory fixes both: the container follows a replacement,
      # and a restart is no longer the only way to pick up a host-side edit.
      #
      # Deliberately NOT :ro — with storage.mode=file the UI saves config
      # changes by rewriting config/agentgateway.yaml, and POST /api/costs/refresh-base (the
      # UI's "refresh costs" action) rewrites base-costs.json from models.dev
      # and hot-reloads it. A read-only mount makes both fail. The container
      # runs as uid 65532, so on Linux the files must be group/other writable
      # (chmod 666 config/agentgateway.yaml base-costs.json) for a save to land; Docker
      # Desktop and OrbStack on macOS map the owner and need nothing.
      # Set AGENTGATEWAY_STORAGE_MODE=readOnly and append :ro to lock it down.
      - .:/etc/agentgateway
      # Mounting the directory also exposes this directory's .env — the keys
      # compose reads to build the environment above. The gateway has no use
      # for the file, so shadow it with an empty one. /dev/null is safe as a
      # single-file mount precisely because nothing ever replaces it.
      - /dev/null:/etc/agentgateway/.env:ro
    working_dir: /etc/agentgateway
    command: ["-f", "/etc/agentgateway/config/agentgateway.yaml"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: agentgateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentgateway
      POSTGRES_USER: agentgateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentgateway}
    # Not published by default: the gateway reaches it over the compose network.
    # Uncomment to inspect it with psql from the host.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgateway -d agentgateway"]
      interval: 5s
      timeout: 5s
      retries: 12

  jaeger:
    # Pinned like the gateway, and for the same reason: a tag that resolves to
    # something else next month breaks a config that validates today.
    #
    # all-in-one, not jaegertracing/jaeger:2.x. v1 keeps the classic UI on
    # :16686 and takes OTLP on :4317; the 2.x image is an OTel-Collector
    # rebuild whose config is passed as a file, which is a second thing to
    # mount and get wrong for a demo that only needs a trace list.
    image: jaegertracing/all-in-one:1.76.0
    container_name: agentgateway-jaeger
    restart: unless-stopped
    ports:
      # Loopback only, matching the gateway. 16686 is the query UI and read API.
      #
      # Overridable because a Jaeger is a common thing to already have running:
      # Jaeger Desktop and most "docker run jaeger" recipes take 16686 on all
      # interfaces, and compose then fails with "port is already allocated".
      # Set JAEGER_UI_PORT to move this one aside.
      #
      # 4317 is deliberately NOT published. Nothing on the host needs to push
      # traces at this container: the producer is agentgateway, its sibling on
      # the compose network, which reaches it at `jaeger:4317`. Publishing the
      # port would only re-create the same clash on 4317.
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    environment:
      # v1 does NOT open the OTLP receiver unless this is set. Without it the
      # container starts, the UI answers, and every export fails with
      # "connection refused" on 4317 — which reads as a broken client.
      COLLECTOR_OTLP_ENABLED: "true"
    # No volume: all-in-one defaults to in-memory storage, so traces are lost
    # on restart. That is the intent here — a demo should not accumulate a
    # trace database on the host, and an empty UI after `up -d` is expected,
    # not a symptom.

volumes:
  postgres-data:
