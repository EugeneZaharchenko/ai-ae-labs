# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  # Траси до Jaeger. Без цього блоку шлюз не надсилає нічого: контейнер jaeger
  # піднятий, UI на :16686 відповідає, але список сервісів порожній — що
  # виглядає як зламаний експортер, а не як вимкнений.
  #
  # `randomSampling: true` обов'язковий, а не косметичний. Типове значення
  # семплінгу — «не брати нічого»: перевірено живцем, 5 запитів без цього поля
  # дали 0 нових трас, ті самі 5 з ним — 5 трас.
  tracing:
    # Сусід по compose-мережі, а не localhost: шлюз у контейнері, і
    # `localhost:4317` указував би на нього самого.
    #
    # Змінна НАВМИСНО не зветься OTEL_EXPORTER_OTLP_ENDPOINT, хоч шлюз її і
    # розуміє. Це загальновідоме ім'я, яке ставлять інші інструменти: якщо в
    # оточенні вже є `OTEL_EXPORTER_OTLP_ENDPOINT=127.0.0.1:4317` (а воно
    # трапляється — так робить pi-go), `${VAR:-default}` підхопить саме його,
    # і трасування мовчки зламається: без схеми `http://` парсер падає з
    # `first path segment in URL cannot contain colon`, а `127.0.0.1` у
    # контейнері — це сам шлюз. Окреме ім'я прибирає цю пастку.
    otlpEndpoint: ${AGENTGATEWAY_OTLP_ENDPOINT:-http://jaeger:4317}
    # Jaeger all-in-one приймає OTLP саме по gRPC на 4317. 4318 — HTTP-приймач,
    # і з ним цей самий endpoint мовчки не працює.
    otlpProtocol: grpc
    randomSampling: true
  logging:
    fields:
      add:
        llm.prompt: llm.prompt
        llm.completion: llm.completion
  database:
    url: ${AGENTGATEWAY_DATABASE_URL:-postgresql://agentgateway:agentgateway@localhost:5432/agentgateway}
  storage:
    mode: ${AGENTGATEWAY_STORAGE_MODE:-file}
  modelCatalog:
    - file: ${AGENTGATEWAY_BASE_COSTS:-./base-costs.json}
    - file: ${AGENTGATEWAY_PI_ALIASES:-./pi-aliases.json}
    - inline:
        providers: {}
frontendPolicies:
  http:
    maxBufferSize: 20971520
gateways:
  default:
    port: 4000
mcp:
  gateways: default
  prefixMode: always
  targets:
    - name: openai-docs
      mcp:
        host: https://developers.openai.com/mcp
    - name: tavily
      mcp:
        host: mcp.tavily.com
        port: 443
        path: /mcp/?tavilyApiKey=${TAVILY_API_KEY:-}
      policies:
        backendTLS:
          hostname: mcp.tavily.com
    - name: openrouter
      mcp:
        host: https://mcp.openrouter.ai/mcp
ui:
  gateways: default
llm:
  providers:
    - name: anthropic
      provider: anthropic
      params:
        apiKey: ${ANTHROPIC_API_KEY:-}
    - name: openai
      provider: openai
      params:
        apiKey: ${OPENAI_API_KEY:-}
    # gemini — один провайдер, обидва протоколи.
    #
    # `formats[].path` перевизначає шлях для конкретного формату, тому
    # OpenAI-сумісний шлях і нативний живуть на одному `baseUrl` і не
    # потребують двох провайдерів: голий baseUrl + `path` на кожен формат.
    #
    # Чому baseUrl голий, без `/v1beta/openai`: `path` уже містить повний
    # шлях, і `/v1beta/openai` у baseUrl дав би `.../v1beta/openai/v1beta/openai/...`.
    #
    # Автентифікація теж одна на обидва: `authorization` знімається, ключ іде
    # заголовком `x-goog-api-key`, який приймає і нативний Gemini, і його
    # OpenAI-сумісна поверхня. `apiKey` у `params` лишається, бо без нього
    # провайдер не має чим себе ідентифікувати в каталозі.
    #
    # УВАГА, головна межа — на серверних інструментах, і вона між ФОРМАТАМИ, а
    # не між форматами й нативом:
    #   * нативний формат (клієнт сам кличе `:generateContent`) доносить
    #     `{"googleSearch":{}}` до Google і дає `groundingMetadata`;
    #   * формат `completions` його ВТРАЧАЄ ТИХО: конвертер OpenAI→native
    #     відкидає `{"type":"google_search"}`, у запиті до upstream ключа
    #     `tools` немає взагалі (перевірено перехопленням), у лозі — нічого, а
    #     модель відповідає впевнено й вигадує (у тесті: «June 8th» замість
    #     вересня, `grounding` відсутній). Функціональні інструменти
    #     (`functionDeclarations`) конвертуються нормально.
    #
    # Тобто переведення `gemini/*` на нативний формат НЕ лікує OpenAI-форматних
    # клієнтів — воно замінює гучний `400 Invalid tool type` на тиху вигадку.
    # Лікує лише нативний клієнт: він кличе `:generateContent` на тому самому
    # маршруті `gemini/*`, який тепер обслуговує обидва формати.
    - name: gemini
      provider:
        custom:
          providerOverride: gcp.gemini
          formats:
            - type: completions
              path: /v1beta/openai/chat/completions
            - type: generateContent
      params:
        baseUrl: https://generativelanguage.googleapis.com
        apiKey: ${GEMINI_API_KEY:-}
      defaults:
        requestHeaders:
          remove:
            - authorization
          set:
            # Лапки обов'язкові: порожня підстановка дає YAML null, а заголовок
            # мусить бути рядком — без лапок конфіг не проходить валідацію:
            #   requestHeaders.set.x-goog-api-key: invalid type: null, expected a string
            # `apiKey` того ж `${VAR:-}` переживає, бо приймає null.
            x-goog-api-key: "${GEMINI_API_KEY:-}"
    - name: mistral
      provider: mistral
      params:
        apiKey: ${MISTRAL_API_KEY:-}
    - name: openrouter
      provider: openrouter
      params:
        apiKey: ${OPENROUTER_API_KEY:-}
    - name: xai
      provider: xai
      params:
        apiKey: ${XAI_API_KEY:-}
    - name: ollama
      provider: ollama
      params:
        baseUrl: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
    - name: prismml
      provider:
        custom:
          formats:
            - type: completions
      params:
        baseUrl: ${PRISMML_BASE_URL:-http://host.docker.internal:11234/v1}
        apiKey: ${PRISMML_API_KEY:-local}
    - name: ollama-cloud
      provider: ollama
      params:
        baseUrl: https://ollama.com/v1
        apiKey: ${OLLAMA_API_KEY:-}
    - name: opencode
      provider:
        custom:
          providerOverride: opencode
          formats:
            - type: completions
            - type: messages
      params:
        baseUrl: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/go/v1}
        apiKey: ${OPENCODE_API_KEY:-}
  models:
    - name: anthropic/*
      provider:
        reference: anthropic
      transformation:
        model: llmRequest.model.stripPrefix("anthropic/")
    - name: openai/*
      provider:
        reference: openai
      transformation:
        model: llmRequest.model.stripPrefix("openai/")
    # gemini/* — НАТИВНИЙ маршрут.
    #
    # Було: OpenAI-сумісний (`formats: [completions]`, `/v1beta/openai`), і
    # `gemini/gemini-2.5-flash + geminitool.GoogleSearch` падало з
    # `400 Invalid tool type: google_search` — OpenAI-схема не виражає
    # вбудовані серверні інструменти Gemini.
    #
    # Стало: нативний `generateContent`. Для клієнтів, які говорять нативним
    # протоколом, `{"googleSearch":{}}` доходить до Gemini і дає справжній
    # grounding (`groundingMetadata.searchEntryPoint`).
    #
    # УВАГА, ціна зміни: для OpenAI-форматних клієнтів (у т.ч. лаби Day1 через
    # `agentgateway/gemini/...`) конвертер OpenAI→native відкидає
    # `{"type":"google_search"}` ТИХО — у запиті до upstream ключа `tools` немає
    # взагалі, у лозі нічого, а модель відповідає впевнено й вигадує
    # (перевірено: дати «June 15th» замість вересня, `groundingMetadata`
    # відсутня). Раніше на цьому шляху був гучний 400. Функціональні
    # інструменти (`functionDeclarations`) конвертуються нормально — втрата
    # стосується саме вбудованих.
    #
    # Маршрут `gemini/*` лишається на провайдері `gemini`, який тепер
    # обслуговує обидва формати: OpenAI-форматний клієнт іде `completions`, а
    # нативний — `generateContent`. Обидва шляхи перевірені на одному
    # провайдері.
    - name: gemini/*
      provider:
        reference: gemini
      transformation:
        model: llmRequest.model.stripPrefix("gemini/")
    - name: mistral/*
      provider:
        reference: mistral
      transformation:
        model: llmRequest.model.stripPrefix("mistral/")
    - name: openrouter/*
      provider:
        reference: openrouter
      transformation:
        model: llmRequest.model.stripPrefix("openrouter/")
    - name: xai/*
      provider:
        reference: xai
      transformation:
        model: llmRequest.model.stripPrefix("xai/")
    - name: ollama/*
      provider:
        reference: ollama
      transformation:
        model: llmRequest.model.stripPrefix("ollama/")
    - name: prismml/*
      provider:
        reference: prismml
      transformation:
        model: llmRequest.model.stripPrefix("prismml/")
    - name: ollama-cloud/*
      provider:
        reference: ollama-cloud
      transformation:
        model: llmRequest.model.stripPrefix("ollama-cloud/")
    - name: ollama1/*
      provider:
        reference: ollama-cloud
      transformation:
        model: llmRequest.model.stripPrefix("ollama1/")
    - name: opencode/*
      provider:
        reference: opencode
      transformation:
        model: llmRequest.model.stripPrefix("opencode/")
    - name: claude-*
      provider:
        reference: anthropic
    - name: gpt-*
      provider:
        reference: openai
    - name: o3*
      provider:
        reference: openai
    - name: gemini-*
      provider:
        reference: gemini
    - name: grok-*
      provider:
        reference: xai
  virtualModels:
    - name: ollama-deepseek-balanced
      routing:
        weighted:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              weight: 1
    - name: ollama-gemma4
      routing:
        failover:
          targets:
            - model: ollama-cloud/gemma4:cloud
              priority: 0
    - name: ollama-glm-flash
      routing:
        failover:
          targets:
            - model: ollama-cloud/glm-5.3-flash:cloud
              priority: 0
    - name: ollama-minimax
      routing:
        failover:
          targets:
            - model: ollama-cloud/minimax-m3:cloud
              priority: 0
    - name: ollama-deepseek
      routing:
        failover:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              priority: 0
    - name: ollama-dsf4
      routing:
        failover:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              priority: 0
    - name: pi-default
      routing:
        failover:
          targets:
            - model: openai/gpt-5.6-luna
              priority: 1
            - model: gemini/gemini-3.8-flash
              priority: 2
    - name: pi-fast
      routing:
        failover:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              priority: 0
            - model: openai/gpt-5.6-luna
              priority: 1
  policies:
    apiKey:
      mode: strict
      keys:
        - key: ${AGENTGATEWAY_API_KEY:-agw_sk_CHANGE_ME}
          metadata:
            name: pi-go
            agentgateway.dev/id: 32a5356e-e005-45a1-ade5-d4862546b64c
            agentgateway.dev/createdAt: 1788259453
        - key: agw_sk_x9dru9vISJ852w9ccpV0uNuYJpU2Qgc7
          metadata:
            name: playground
            agentgateway.dev/id: 8c78bde4-4cf3-4d5c-b446-4ec12b465fa2
            agentgateway.dev/createdAt: 1789764186
